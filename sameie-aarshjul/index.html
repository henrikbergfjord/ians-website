<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IANS · Årshjul</title><style>:root{--bg:#03101a;--panel:#091a28;--line:#1a3b55;--text:#f6f8fb;--muted:#9aafc0;--blue:#238dff;--cyan:#25d8ff;--green:#42df91;--red:#ff6e76;--amber:#ffbe55}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#020a12,#061522 55%,#020910);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:5;background:#04111ced;border-bottom:1px solid #123049;backdrop-filter:blur(12px)}.topin,.wrap{width:min(1420px,calc(100% - 26px));margin:auto}.topin{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,button,input,select,textarea{font:inherit}.btn,button{border:1px solid #2d749f;background:#0b2940;color:#fff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary,button.primary{background:linear-gradient(135deg,#0b76e5,#16b9df);border-color:#2cc8ed}.btn.ghost{background:#071725}.wrap{padding:30px 0 60px}.hero{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}.eyebrow{color:var(--cyan);font-weight:900;font-size:.7rem;letter-spacing:.15em}.hero h1{font-size:clamp(2.4rem,6vw,5rem);margin:8px 0 0;line-height:.98}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{background:#081827;border:1px solid var(--line);border-radius:20px;padding:18px}.panel h2{margin-top:0}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:.82rem;font-weight:800;color:#bed0dd}.field input,.field select,.field textarea{width:100%;background:#04121e;border:1px solid #21455e;color:white;border-radius:10px;padding:11px}.field textarea{min-height:82px;resize:vertical}.check{display:flex;gap:8px;align-items:center;margin:11px 0}.check input{width:auto}.wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.month{background:#071725;border:1px solid #183b54;border-radius:16px;min-height:210px;overflow:hidden}.monthhead{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-bottom:1px solid #17364c;background:#0a1f30}.monthhead b{font-size:1rem}.count{font-size:.75rem;color:#8fb0c6}.events{padding:8px;display:grid;gap:7px}.event{border:1px solid #244e68;background:#0a2031;border-radius:10px;padding:9px;position:relative}.event.holiday{border-color:#72582a;background:#221d13}.event .date{font-size:.72rem;color:#8fb0c6}.event .title{font-weight:850;margin-top:2px;padding-right:22px}.event small{display:block;color:#9fb1bf;margin-top:3px}.event .del{position:absolute;right:6px;top:6px;padding:2px 7px;border-radius:7px;background:#35171a;border-color:#653037;color:#ffb0b4}.legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;color:#a8bbc9;font-size:.84rem}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#3aa6ff}.dot.h{background:#ffbe55}.status{margin-top:10px;font-size:.85rem;color:#91a8b8}.empty{color:#627d90;font-size:.82rem;padding:6px}@media(max-width:1080px){.layout{grid-template-columns:1fr}.wheel{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.wheel{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.topin{align-items:flex-start;padding:12px 0;flex-direction:column}}@media print{.top,.formpanel,.hero .muted,.legend,.del{display:none!important}body{background:white;color:#111}.wrap{width:100%;padding:0}.hero{margin:0 0 10px}.hero h1{font-size:28px}.layout{display:block}.panel{border:0;padding:0;background:white}.wheel{grid-template-columns:repeat(3,1fr);gap:6px}.month{border:1px solid #bbb;background:white;break-inside:avoid;min-height:180px}.monthhead{background:#eee;color:#111}.event{background:white;color:#111;border:1px solid #ccc}.event.holiday{background:#fff8e8}.event .date,.event small{color:#555}}</style></head><body><header class="top"><div class="topin"><div class="brand">IANS · ÅRSHJUL</div><div class="actions"><button onclick="window.print()">🖨️ Skriv ut / PDF</button><button onclick="downloadCsv()">⬇️ Last ned CSV</button><button onclick="sendEmail()">✉️ Send e-post</button><a class="btn ghost" href="/.auth/logout?post_logout_redirect_uri=/sameie-aarshjul-login.html">Logg ut</a></div></div></header><main class="wrap"><section class="hero"><div><div class="eyebrow">SAMEIENETT · STYREVERKTØY</div><h1>Årshjul <span id="yearLabel"></span></h1></div><div class="muted" id="who">Laster innlogget bruker…</div></section><div class="layout"><aside class="panel formpanel"><h2>Ny aktivitet</h2><div class="field"><label>Tittel</label><input id="title" placeholder="F.eks. kontroll av brannalarmanlegg"></div><div class="field"><label>Dato</label><input id="date" type="date"></div><div class="field"><label>Kategori</label><select id="category"><option>Drift</option><option>HMS</option><option>Økonomi</option><option>Vedlikehold</option><option>Styremøte</option><option>Årsmøte</option><option>Kommunikasjon</option><option>Annet</option></select></div><div class="field"><label>Notat</label><textarea id="notes" placeholder="Ansvarlig, leverandør, hva som må gjøres …"></textarea></div><label class="check"><input id="annual" type="checkbox" checked> Gjenta automatisk hvert år</label><div class="field"><label>Varsle i forkant</label><select id="notifyDays"><option value="0">Ingen varsling</option><option value="1">1 dag før</option><option value="3">3 dager før</option><option value="7" selected>7 dager før</option><option value="14">14 dager før</option><option value="30">30 dager før</option><option value="60">60 dager før</option></select></div><div class="field"><label>E-post for varsel</label><input id="email" type="email" placeholder="styret@sameie.no"></div><button class="primary" onclick="addEvent()">＋ Legg til i årshjulet</button><div class="status" id="status"></div><hr style="border:0;border-top:1px solid #17364c;margin:20px 0"><div class="field"><label>Vis år</label><select id="yearSelect" onchange="changeYear()"></select></div><p class="muted" style="font-size:.85rem;line-height:1.5">Norske offentlige helligdager beregnes automatisk for valgt år. Egne årlige aktiviteter flyttes til samme måned og dag når du bytter år.</p></aside><section class="panel"><div class="legend"><span><i class="dot"></i>Styrets aktiviteter</span><span><i class="dot h"></i>Norsk helligdag</span></div><div id="wheel" class="wheel"></div></section></div></main><script>const months=['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];let items=[];let currentYear=new Date().getFullYear();function pad(n){return String(n).padStart(2,'0')}function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function isoLocal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function holidays(y){let e=easter(y);return[{title:'Første nyttårsdag',date:`${y}-01-01`},{title:'Skjærtorsdag',date:isoLocal(addDays(e,-3))},{title:'Langfredag',date:isoLocal(addDays(e,-2))},{title:'Første påskedag',date:isoLocal(e)},{title:'Andre påskedag',date:isoLocal(addDays(e,1))},{title:'Arbeidernes dag',date:`${y}-05-01`},{title:'Grunnlovsdagen',date:`${y}-05-17`},{title:'Kristi himmelfartsdag',date:isoLocal(addDays(e,39))},{title:'Første pinsedag',date:isoLocal(addDays(e,49))},{title:'Andre pinsedag',date:isoLocal(addDays(e,50))},{title:'Første juledag',date:`${y}-12-25`},{title:'Andre juledag',date:`${y}-12-26`}]}function adjustedDate(it,y){if(!it.annual)return it.date;return y+it.date.slice(4)}function render(){document.getElementById('yearLabel').textContent=currentYear;const h=holidays(currentYear);const wheel=document.getElementById('wheel');wheel.innerHTML='';months.forEach((name,mi)=>{const mine=items.filter(i=>{const d=adjustedDate(i,currentYear);return Number(d.slice(0,4))===currentYear&&Number(d.slice(5,7))===mi+1}).sort((a,b)=>adjustedDate(a,currentYear).localeCompare(adjustedDate(b,currentYear)));const hol=h.filter(x=>Number(x.date.slice(5,7))===mi+1);const box=document.createElement('article');box.className='month';box.innerHTML=`<div class="monthhead"><b>${name}</b><span class="count">${mine.length} oppg.</span></div><div class="events"></div>`;const ev=box.querySelector('.events');hol.forEach(x=>{const d=x.date;ev.insertAdjacentHTML('beforeend',`<div class="event holiday"><div class="date">${d.slice(8,10)}.${d.slice(5,7)}</div><div class="title">${x.title}</div><small>Norsk helligdag</small></div>`)});mine.forEach(x=>{const d=adjustedDate(x,currentYear);const repeat=x.annual?' · årlig':'';const notify=x.notifyDays?` · varsel ${x.notifyDays} d før`:'';ev.insertAdjacentHTML('beforeend',`<div class="event"><button class="del" onclick="removeEvent('${x.id}')">×</button><div class="date">${d.slice(8,10)}.${d.slice(5,7)} · ${escapeHtml(x.category||'Oppgave')}</div><div class="title">${escapeHtml(x.title)}</div>${x.notes?`<small>${escapeHtml(x.notes)}</small>`:''}<small>${repeat}${notify}</small></div>`)});if(!mine.length&&!hol.length)ev.innerHTML='<div class="empty">Ingen aktiviteter</div>';wheel.appendChild(box)})}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function load(){for(let y=currentYear-2;y<=currentYear+4;y++){document.getElementById('yearSelect').insertAdjacentHTML('beforeend',`<option ${y===currentYear?'selected':''}>${y}</option>`)}try{const me=await fetch('/.auth/me').then(r=>r.json());const p=me.clientPrincipal;document.getElementById('who').textContent=p?`Innlogget: ${p.userDetails}`:'Ikke innlogget';if(p&&p.userDetails)document.getElementById('email').value=p.userDetails;const r=await fetch('/api/yearwheel');const j=await r.json();if(!r.ok)throw new Error(j.error||'Kunne ikke laste');items=j.items||[];render()}catch(e){document.getElementById('status').textContent=e.message;render()}}async function addEvent(){const payload={title:title.value.trim(),date:date.value,category:category.value,notes:notes.value.trim(),annual:annual.checked,notifyDays:Number(notifyDays.value),email:email.value.trim()};if(!payload.title||!payload.date){status.textContent='Fyll inn tittel og dato.';return}status.textContent='Lagrer…';const r=await fetch('/api/yearwheel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok){status.textContent=j.error||'Kunne ikke lagre.';return}items.push(j.item);title.value='';notes.value='';status.textContent='Lagret.';render()}async function removeEvent(id){if(!confirm('Slette aktiviteten?'))return;const r=await fetch('/api/yearwheel?id='+encodeURIComponent(id),{method:'DELETE'});if(r.ok){items=items.filter(i=>i.id!==id);render()}}function changeYear(){currentYear=Number(document.getElementById('yearSelect').value);render()}function csvCell(v){return '"'+String(v||'').replace(/"/g,'""')+'"'}function downloadCsv(){let rows=[['Dato','Tittel','Kategori','Notat','Årlig','Varsling dager','E-post']];items.forEach(i=>rows.push([adjustedDate(i,currentYear),i.title,i.category,i.notes,i.annual?'Ja':'Nei',i.notifyDays||0,i.email||'']));holidays(currentYear).forEach(h=>rows.push([h.date,h.title,'Helligdag','','','','']));rows.sort((a,b)=>a[0]==='Dato'?-1:String(a[0]).localeCompare(String(b[0])));const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`IANS-aarshjul-${currentYear}.csv`;a.click();URL.revokeObjectURL(a.href)}async function sendEmail(){const to=prompt('Hvilken e-postadresse skal årshjulet sendes til?',document.getElementById('email').value||'');if(!to)return;const payload={to,year:currentYear,items:items.map(i=>({...i,date:adjustedDate(i,currentYear)})),holidays:holidays(currentYear)};const r=await fetch('/api/yearwheel-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));alert(r.ok?'Årshjulet er sendt på e-post.':(j.error||'Kunne ikke sende e-post.'))}load();</script></body></html>
