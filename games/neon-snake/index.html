<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>IANS Neon Snake</title><style>*{box-sizing:border-box}body{margin:0;background:#04101b;color:#fff;font-family:system-ui;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}.top a,.top button,.ctrl button,.start{border:1px solid #214c70;background:#081b2c;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;font-weight:800}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#081a2b;border:1px solid #1c4669;border-radius:13px;text-align:center;padding:8px}.stat b{display:block;font-size:22px;color:#4fdcff}.stat small{font-size:9px;color:#8ea7ba}canvas{width:100%;aspect-ratio:1;display:block;background:#07182a;border:2px solid #24587e;border-radius:18px;touch-action:none}.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:12px auto}.ctrl button{min-height:58px;font-size:20px}.ctrl .up{grid-column:2}.ctrl .left{grid-column:1}.ctrl .down{grid-column:2}.ctrl .right{grid-column:3}.start{width:100%;min-height:50px;font-size:16px}</style></head><body><main class="wrap"><div class="top"><a href="/games/">‹ Spill</a><strong>🐍 NEON SNAKE</strong><button id="reset">↻</button></div><div class="hud"><div class="stat"><b id="level">1</b><small>LEVEL</small></div><div class="stat"><b id="score">0</b><small>POENG</small></div><div class="stat"><b id="best">0</b><small>BESTE</small></div></div><canvas id="c" width="480" height="480"></canvas><div class="ctrl"><button class="up" data-d="u">▲</button><button class="left" data-d="l">◀</button><button class="down" data-d="d">▼</button><button class="right" data-d="r">▶</button></div><button class="start" id="start">START</button></main><script>const c=document.getElementById('c'),x=c.getContext('2d'),L=20,S=24;let snake,dir,next,food,score=0,level=1,best=+(localStorage.iansSnakeBest||0),timer=null,running=false;document.getElementById('best').textContent=best;function rnd(){return Math.floor(Math.random()*L)}function spawn(){do food={x:rnd(),y:rnd()};while(snake.some(p=>p.x===food.x&&p.y===food.y))}function init(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next={x:1,y:0};score=0;level=1;spawn();draw();hud()}function hud(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;best=Math.max(best,score);localStorage.iansSnakeBest=best;document.getElementById('best').textContent=best}function draw(){x.fillStyle='#07182a';x.fillRect(0,0,480,480);x.strokeStyle='#102b44';for(let i=0;i<=L;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,480);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(480,i*S);x.stroke()}x.fillStyle='#ffb13b';x.beginPath();x.arc(food.x*S+12,food.y*S+12,8,0,7);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#36d98a':'#65e8ff';x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)})}function tick(){dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=L||h.y>=L||snake.some(p=>p.x===h.x&&p.y===h.y)){stop();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;level=1+Math.floor(score/60);spawn();speed()}else snake.pop();hud();draw()}function speed(){if(!running)return;clearInterval(timer);timer=setInterval(tick,Math.max(70,170-level*7))}function start(){running=true;document.getElementById('start').textContent='PAUSE';speed()}function stop(){running=false;clearInterval(timer);document.getElementById('start').textContent='START IGJEN'}function setD(d){const m={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}}[d];if(m.x!==-dir.x||m.y!==-dir.y)next=m}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setD(b.dataset.d));document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')setD('u');if(e.key==='ArrowDown')setD('d');if(e.key==='ArrowLeft')setD('l');if(e.key==='ArrowRight')setD('r')});document.getElementById('start').onclick=()=>running?stop():start();document.getElementById('reset').onclick=()=>{stop();init()};init();</script></body></html>
