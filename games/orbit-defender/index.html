<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>IANS Orbit Defender</title><style>*{box-sizing:border-box}body{margin:0;background:#030914;color:#fff;font-family:system-ui;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}.top a,.top button,.start{border:1px solid #214b6e;background:#071829;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;font-weight:800}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#071827;border:1px solid #1c4466;border-radius:13px;text-align:center;padding:8px}.stat b{display:block;font-size:22px;color:#51d7ff}.stat small{font-size:9px;color:#8ea7ba}canvas{width:100%;aspect-ratio:1;display:block;background:radial-gradient(circle,#0c2743,#06101c 60%,#02070d);border:2px solid #24577d;border-radius:18px;touch-action:none}.start{width:100%;margin-top:10px;min-height:50px;font-size:16px}.hint{text-align:center;color:#8fa5b7;font-size:11px}</style></head><body><main class="wrap"><div class="top"><a href="/games/">‹ Spill</a><strong>🚀 ORBIT DEFENDER</strong><button id="reset">↻</button></div><div class="hud"><div class="stat"><b id="level">1</b><small>LEVEL</small></div><div class="stat"><b id="score">0</b><small>POENG</small></div><div class="stat"><b id="lives">3</b><small>LIV</small></div></div><canvas id="c" width="600" height="600"></canvas><button id="start" class="start">START</button><p class="hint">Trykk eller dra rundt IANS CORE for å rotere forsvareren. Skyt automatisk mot innkommende objekter.</p></main><script>const c=document.getElementById('c'),x=c.getContext('2d');let angle=0,enemies=[],shots=[],score=0,level=1,lives=3,running=false,last=0,spawn=0;function hud(){level=Math.max(1,1+Math.floor(score/120));document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives}function reset(){angle=0;enemies=[];shots=[];score=0;level=1;lives=3;running=false;hud();draw();document.getElementById('start').textContent='START'}function fire(){shots.push({r:95,a:angle,v:5})}function update(dt){if(!running)return;spawn-=dt;if(spawn<=0){enemies.push({r:300,a:Math.random()*Math.PI*2,v:.035+level*.003});spawn=Math.max(240,900-level*35)}if(Math.random()<dt/420)fire();shots.forEach(s=>s.r+=s.v*dt*.06);enemies.forEach(e=>e.r-=e.v*dt);for(let e of enemies){for(let s of shots){let ax=300+Math.cos(e.a)*e.r,ay=300+Math.sin(e.a)*e.r,bx=300+Math.cos(s.a)*s.r,by=300+Math.sin(s.a)*s.r;if((ax-bx)**2+(ay-by)**2<350){e.hit=s.hit=true;score+=10}}if(e.r<62&&!e.hit){e.hit=true;lives--;if(lives<=0){running=false;document.getElementById('start').textContent='PRØV IGJEN'}}}enemies=enemies.filter(e=>!e.hit&&e.r>-20);shots=shots.filter(s=>!s.hit&&s.r<330);hud()}function draw(){x.clearRect(0,0,600,600);x.strokeStyle='#154a74';x.lineWidth=2;[90,150,215].forEach(r=>{x.beginPath();x.arc(300,300,r,0,7);x.stroke()});x.fillStyle='#0a76c7';x.beginPath();x.arc(300,300,58,0,7);x.fill();x.fillStyle='#fff';x.font='bold 18px system-ui';x.textAlign='center';x.fillText('IANS CORE',300,306);let px=300+Math.cos(angle)*92,py=300+Math.sin(angle)*92;x.save();x.translate(px,py);x.rotate(angle+Math.PI/2);x.fillStyle='#65e6ff';x.beginPath();x.moveTo(0,-15);x.lineTo(10,12);x.lineTo(0,7);x.lineTo(-10,12);x.closePath();x.fill();x.restore();for(let e of enemies){let ex=300+Math.cos(e.a)*e.r,ey=300+Math.sin(e.a)*e.r;x.fillStyle='#ff8b3d';x.beginPath();x.arc(ex,ey,10,0,7);x.fill()}for(let s of shots){let sx=300+Math.cos(s.a)*s.r,sy=300+Math.sin(s.a)*s.r;x.fillStyle='#fff';x.beginPath();x.arc(sx,sy,4,0,7);x.fill()}}function loop(t){let dt=Math.min(32,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}function setAngle(e){let r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;angle=Math.atan2(e.clientY-cy,e.clientX-cx)}c.addEventListener('pointerdown',setAngle);c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setAngle(e)});document.getElementById('start').onclick=()=>{if(lives<=0){score=0;lives=3;enemies=[];shots=[]}running=!running;document.getElementById('start').textContent=running?'PAUSE':'FORTSETT'};document.getElementById('reset').onclick=reset;reset();requestAnimationFrame(loop);</script></body></html>
