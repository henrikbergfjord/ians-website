<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>IANS Brick Breaker</title><style>*{box-sizing:border-box}body{margin:0;background:#05101a;color:#fff;font-family:system-ui;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}.top a,.top button,.start{border:1px solid #214a6b;background:#081a2b;color:#fff;border-radius:12px;padding:10px 13px;text-decoration:none;font-weight:800}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#081a2b;border:1px solid #1c4463;border-radius:13px;text-align:center;padding:8px}.stat b{display:block;font-size:22px;color:#52d6ff}.stat small{font-size:9px;color:#8ea7ba}.stage{position:relative}canvas{display:block;width:100%;aspect-ratio:4/5;background:#071827;border:2px solid #24577d;border-radius:18px;touch-action:none}.start{width:100%;margin-top:10px;min-height:50px;font-size:16px}.hint{text-align:center;color:#8da4b7;font-size:11px}</style></head><body><main class="wrap"><div class="top"><a href="/games/">‹ Spill</a><strong>🧱 BRICK BREAKER</strong><button id="reset">↻</button></div><div class="hud"><div class="stat"><b id="level">1</b><small>LEVEL</small></div><div class="stat"><b id="score">0</b><small>POENG</small></div><div class="stat"><b id="best">0</b><small>BESTE</small></div></div><canvas id="c" width="600" height="760"></canvas><button id="start" class="start">START</button><p class="hint">Dra fingeren sideveis nederst på brettet. På PC kan du bruke ← og →.</p></main><script>const c=document.getElementById('c'),x=c.getContext('2d');let paddle,ball,bricks,score=0,level=1,best=+(localStorage.iansBrickBest||0),running=false,keys={},raf;function build(){paddle={x:230,y:700,w:140,h:16};ball={x:300,y:650,vx:3.4+level*.18,vy:-4.2-level*.14,r:9};bricks=[];let rows=Math.min(8,3+Math.floor(level/2)),cols=8;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)bricks.push({x:25+col*69,y:70+r*34,w:58,h:22,alive:true});draw()}function hud(){document.getElementById('level').textContent=level;document.getElementById('score').textContent=score;best=Math.max(best,score);localStorage.iansBrickBest=best;document.getElementById('best').textContent=best}function draw(){x.fillStyle='#071827';x.fillRect(0,0,600,760);for(let i=0;i<bricks.length;i++){let b=bricks[i];if(!b.alive)continue;x.fillStyle=['#38d98c','#57c9ff','#b26eff','#ffb13b'][i%4];x.fillRect(b.x,b.y,b.w,b.h)}x.fillStyle='#dff7ff';x.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fillStyle='#fff';x.fill()}function step(){if(!running)return;if(keys.ArrowLeft)paddle.x-=7;if(keys.ArrowRight)paddle.x+=7;paddle.x=Math.max(0,Math.min(600-paddle.w,paddle.x));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>600-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy*=-1;if(ball.y+ball.r>=paddle.y&&ball.y< paddle.y+20&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-(paddle.x+paddle.w/2))*.02}for(let b of bricks){if(!b.alive)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false;ball.vy*=-1;score+=10;break}}if(bricks.every(b=>!b.alive)){level++;build()}if(ball.y>780){running=false;document.getElementById('start').textContent='PRØV IGJEN';build()}hud();draw();raf=requestAnimationFrame(step)}function start(){if(running)return;running=true;document.getElementById('start').textContent='SPILLER';raf=requestAnimationFrame(step)}document.addEventListener('keydown',e=>keys[e.key]=true);document.addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let r=c.getBoundingClientRect();paddle.x=(e.clientX-r.left)/r.width*600-paddle.w/2}});c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();paddle.x=(e.clientX-r.left)/r.width*600-paddle.w/2});document.getElementById('start').onclick=start;document.getElementById('reset').onclick=()=>{cancelAnimationFrame(raf);running=false;score=0;level=1;build();hud();document.getElementById('start').textContent='START'};build();hud();</script></body></html>
