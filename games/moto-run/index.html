<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>IANS Moto Run</title><style>:root{--bg:#06101c;--panel:#0b1e31;--line:#1b466a;--text:#f5f8fb;--muted:#8fa6ba;--cyan:#40c9ff;--amber:#ffb13b;--green:#4fe08f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#173d66,#081523 54%,#030914);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}.top{height:58px;width:min(720px,calc(100% - 20px));margin:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.top a,.top button{border:1px solid var(--line);background:#07182a;color:#d8efff;border-radius:11px;padding:8px 11px;text-decoration:none;font-weight:800}.title{text-align:center;font-weight:950}.title small{display:block;color:#7eb4dc;font-size:9px;letter-spacing:.13em}.wrap{width:min(720px,100%);margin:auto;padding:0 10px 28px}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px auto 10px;max-width:520px}.stat{background:#07182a;border:1px solid var(--line);border-radius:14px;text-align:center;padding:8px}.stat b{display:block;font-size:22px;color:var(--cyan)}.stat small{font-size:9px;color:var(--muted)}.progress{max-width:520px;margin:0 auto 9px;height:8px;border-radius:999px;background:#07121f;border:1px solid #173956;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#20a0ff,#58e3ff)}.stage{position:relative;border:2px solid #245883;border-radius:18px;overflow:hidden;background:#9fdcff;aspect-ratio:16/10;box-shadow:0 16px 50px #0008}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#03101bd9;padding:24px;text-align:center}.overlay.hidden{display:none}.overlay h1{margin:0 0 8px;font-size:34px}.overlay p{color:#b9c8d4;line-height:1.5;margin:0 0 16px}.overlay button{border:1px solid #4ab8ff;background:#1479d5;color:#fff;border-radius:12px;padding:12px 18px;font-weight:900;font-size:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.controls button{min-height:64px;border:1px solid #24577d;border-radius:16px;background:#081b2d;color:#fff;font-size:18px;font-weight:900;touch-action:none}.controls button:active{transform:scale(.98);background:#0d2944}.hint{text-align:center;color:var(--muted);font-size:11px;line-height:1.45;margin:10px 10px 0}@media(min-width:700px){.controls{max-width:520px;margin:12px auto 0}.controls button{min-height:54px}}@media(max-width:420px){.hud{gap:5px}.stat b{font-size:19px}.stage{aspect-ratio:9/12}.controls button{min-height:70px}}</style></head><body><header class="top"><a href="/games/">‹ Spill</a><div class="title">MOTO RUN<small>IANS GAMES · 50 LEVELS</small></div><button id="restart" type="button">↻</button></header><main class="wrap"><div class="hud"><div class="stat"><b id="level">1</b><small>LEVEL</small></div><div class="stat"><b id="distance">0%</b><small>FREMGANG</small></div><div class="stat"><b id="best">1</b><small>HØYESTE</small></div></div><div class="progress"><i id="bar"></i></div><div class="stage"><canvas id="game" width="900" height="560"></canvas><div class="overlay" id="overlay"><div><h1>Moto Run</h1><p>Kjør Ian gjennom banen, hold balansen over hoppene og nå målstreken. Hvert level blir raskere og vanskeligere.</p><button id="start" type="button">START LEVEL 1</button></div></div></div><div class="controls"><button id="brake" type="button">◀ BREMS / BAK</button><button id="gas" type="button">GASS / FREM ▶</button></div><p class="hint">Mobil: hold inne knappene. PC: bruk ← og →. Fremgangen lagres automatisk på denne enheten.</p></main><script>const C=document.getElementById('game'),ctx=C.getContext('2d'),levelEl=document.getElementById('level'),distEl=document.getElementById('distance'),bestEl=document.getElementById('best'),bar=document.getElementById('bar'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');const SAVE='iansMotoRunV1';let level=1,best=+(localStorage.getItem(SAVE)||1),running=false,left=false,right=false,last=0;let bike,worldX,finish,terrain=[];bestEl.textContent=best;function makeLevel(){worldX=0;finish=2800+level*95;bike={x:190,y:260,vy:0,vx:0,angle:0,air:false,dead:false};terrain=[];let x=0,y=390;terrain.push([0,y]);const count=28+Math.floor(level/2);for(let i=1;i<count;i++){x+=110+Math.random()*80;let amp=Math.min(105,25+level*2.2);y=390+(Math.random()-.5)*amp;if(i%6===0)y-=Math.min(100,30+level*1.6);terrain.push([x,y])}terrain.push([finish+500,390]);updateHud()}function groundAt(x){for(let i=0;i<terrain.length-1;i++){let a=terrain[i],b=terrain[i+1];if(x>=a[0]&&x<=b[0]){let t=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}}return 390}function slopeAt(x){let y1=groundAt(x-5),y2=groundAt(x+5);return Math.atan2(y2-y1,10)}function update(dt){if(!running)return;let accel=right?0.00055:0;if(left)accel-=0.00045;bike.vx+=accel*dt;bike.vx*=Math.pow(.996,dt/16);let max=.30+Math.min(.18,level*.004);bike.vx=Math.max(-.08,Math.min(max,bike.vx));worldX+=bike.vx*dt;worldX=Math.max(0,worldX);let gx=worldX+bike.x,gy=groundAt(gx)-28;if(bike.y<gy-2||bike.vy<0){bike.air=true;bike.vy+=0.0009*dt;bike.y+=bike.vy*dt;if(right)bike.angle+=.0012*dt;if(left)bike.angle-=.0014*dt}else{bike.air=false;bike.y=gy;bike.vy=0;let target=slopeAt(gx);bike.angle+=(target-bike.angle)*Math.min(1,.012*dt)}if(Math.abs(bike.angle)>1.7){fail()}if(worldX+bike.x>=finish){complete()}updateHud()}function updateHud(){let p=Math.max(0,Math.min(100,((worldX+bike.x)/finish)*100));distEl.textContent=Math.floor(p)+'%';bar.style.width=p+'%';levelEl.textContent=level;bestEl.textContent=best}function draw(){ctx.clearRect(0,0,C.width,C.height);let sky=ctx.createLinearGradient(0,0,0,C.height);sky.addColorStop(0,'#68c8ff');sky.addColorStop(1,'#d8f3ff');ctx.fillStyle=sky;ctx.fillRect(0,0,C.width,C.height);ctx.fillStyle='#ffffffaa';for(let i=0;i<6;i++){let cx=((i*190-worldX*.18)%1100+1100)%1100-100;ctx.beginPath();ctx.arc(cx,85+(i%2)*35,30,0,7);ctx.arc(cx+34,78+(i%2)*35,24,0,7);ctx.arc(cx+62,88+(i%2)*35,28,0,7);ctx.fill()}ctx.fillStyle='#4e89a3';ctx.beginPath();ctx.moveTo(0,350);for(let x=0;x<=C.width;x+=80){let y=300+Math.sin((x+worldX*.15)/130)*35;ctx.lineTo(x,y)}ctx.lineTo(C.width,C.height);ctx.lineTo(0,C.height);ctx.fill();ctx.save();ctx.translate(-worldX,0);ctx.fillStyle='#5b3a21';ctx.beginPath();ctx.moveTo(0,C.height);for(let p of terrain)ctx.lineTo(p[0],p[1]);ctx.lineTo(terrain[terrain.length-1][0],C.height);ctx.closePath();ctx.fill();ctx.strokeStyle='#69c94f';ctx.lineWidth=12;ctx.beginPath();terrain.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.fillStyle='#111';ctx.fillRect(finish,groundAt(finish)-120,8,120);for(let r=0;r<6;r++)for(let c=0;c<2;c++){ctx.fillStyle=(r+c)%2?'#fff':'#111';ctx.fillRect(finish+8+c*18,groundAt(finish)-120+r*18,18,18)}ctx.restore();ctx.save();ctx.translate(bike.x,bike.y);ctx.rotate(bike.angle);ctx.fillStyle='#171717';ctx.beginPath();ctx.arc(-32,18,20,0,7);ctx.arc(32,18,20,0,7);ctx.fill();ctx.strokeStyle='#9ee8ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(-32,18,12,0,7);ctx.arc(32,18,12,0,7);ctx.stroke();ctx.strokeStyle='#ff8e24';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-30,8);ctx.lineTo(0,-10);ctx.lineTo(28,8);ctx.moveTo(0,-10);ctx.lineTo(12,-28);ctx.stroke();ctx.fillStyle='#ffcc9a';ctx.beginPath();ctx.arc(5,-45,11,0,7);ctx.fill();ctx.fillStyle='#172b48';ctx.beginPath();ctx.arc(7,-47,13,Math.PI,Math.PI*2);ctx.fill();ctx.strokeStyle='#17375a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(4,-34);ctx.lineTo(-3,-10);ctx.moveTo(1,-25);ctx.lineTo(19,-12);ctx.stroke();ctx.restore()}function loop(t){let dt=Math.min(34,t-last||16);last=t;update(dt);draw();requestAnimationFrame(loop)}function start(){makeLevel();running=true;overlay.classList.add('hidden')}function fail(){if(!running)return;running=false;overlay.classList.remove('hidden');overlay.querySelector('h1').textContent='Oi!';overlay.querySelector('p').textContent='Ian veltet. Prøv level '+level+' en gang til.';startBtn.textContent='PRØV IGJEN'}function complete(){if(!running)return;running=false;if(level<50)level++;best=Math.max(best,level);localStorage.setItem(SAVE,best);overlay.classList.remove('hidden');overlay.querySelector('h1').textContent=level>50?'FERDIG!':'LEVEL FULLFØRT ✓';overlay.querySelector('p').textContent=level>50?'Du klarte alle 50 levels!':'Neste bane blir litt raskere og vanskeligere.';startBtn.textContent=level>50?'SPILL IGJEN':'START LEVEL '+level;if(level>50)level=1}function bindHold(el,key){el.addEventListener('pointerdown',e=>{key(true);el.setPointerCapture?.(e.pointerId);e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>key(false)))}bindHold(document.getElementById('gas'),v=>right=v);bindHold(document.getElementById('brake'),v=>left=v);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')right=true;if(e.key==='ArrowLeft')left=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowRight')right=false;if(e.key==='ArrowLeft')left=false});startBtn.onclick=start;document.getElementById('restart').onclick=()=>{if(confirm('Starte Moto Run på nytt fra level 1?')){level=1;best=1;localStorage.setItem(SAVE,'1');startBtn.textContent='START LEVEL 1';overlay.querySelector('h1').textContent='Moto Run';overlay.querySelector('p').textContent='Kjør Ian gjennom banen, hold balansen over hoppene og nå målstreken.';overlay.classList.remove('hidden')}};level=Math.max(1,Math.min(50,best));startBtn.textContent='START LEVEL '+level;makeLevel();requestAnimationFrame(loop);</script></body></html>
