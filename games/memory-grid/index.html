<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>IANS Memory Grid</title><style>*{box-sizing:border-box}body{margin:0;background:#06101c;color:#fff;font-family:system-ui;min-height:100vh}.wrap{max-width:560px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center}.top a,.top button,.mainbtn{background:#0b1d30;color:#fff;border:1px solid #234c70;border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:800}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#0a1b2c;border:1px solid #1f4669;border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:24px;color:#51cfff}.stat small{color:#8fa5b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cell{aspect-ratio:1;border-radius:15px;background:#122749;border:1px solid #28527b;box-shadow:inset 0 -6px #0a1830}.cell.on{background:#62dbff;box-shadow:0 0 22px #4dd8ff}.cell.good{background:#50df8c}.cell.bad{background:#ff6b6b}.msg{text-align:center;color:#a9bccc;min-height:48px;padding:12px}.mainbtn{width:100%;font-size:17px;min-height:52px}</style></head><body><main class="wrap"><div class="top"><a href="/games/">‹ Spill</a><strong>🧠 MEMORY GRID</strong><button id="reset">↻</button></div><div class="hud"><div class="stat"><b id="level">1</b><small>LEVEL</small></div><div class="stat"><b id="score">0</b><small>POENG</small></div><div class="stat"><b id="best">1</b><small>BESTE</small></div></div><div id="grid" class="grid"></div><div id="msg" class="msg">Trykk START og husk rutene som lyser.</div><button id="start" class="mainbtn">START LEVEL 1</button></main><script>const N=16,g=document.getElementById('grid'),msg=document.getElementById('msg'),lvl=document.getElementById('level'),sc=document.getElementById('score'),be=document.getElementById('best'),btn=document.getElementById('start');let level=1,score=0,best=+(localStorage.iansMemoryBest||1),seq=[],need=[],locked=true;be.textContent=best;for(let i=0;i<N;i++){let b=document.createElement('button');b.className='cell';b.dataset.i=i;b.onclick=()=>tap(i,b);g.appendChild(b)}function target(){return Math.min(10,2+Math.floor(level/2))}function show(){locked=true;need=[];seq=[...Array(target())].map(()=>Math.floor(Math.random()*N));msg.textContent='Se nøye…';[...g.children].forEach(x=>x.className='cell');seq.forEach((x,i)=>setTimeout(()=>{g.children[x].classList.add('on');setTimeout(()=>g.children[x].classList.remove('on'),520)},i*650));setTimeout(()=>{locked=false;need=seq.slice();msg.textContent='Din tur – trykk rutene i samme rekkefølge.'},seq.length*650+200)}function tap(i,b){if(locked)return;let exp=need.shift();if(i===exp){b.classList.add('good');setTimeout(()=>b.classList.remove('good'),180);score+=10;if(!need.length){level++;best=Math.max(best,level);localStorage.iansMemoryBest=best;update();locked=true;msg.textContent='Riktig! Neste level.';btn.textContent='START LEVEL '+level;btn.disabled=false}}else{b.classList.add('bad');locked=true;msg.textContent='Feil rute. Prøv level '+level+' igjen.';btn.textContent='PRØV IGJEN';btn.disabled=false}}function update(){lvl.textContent=level;sc.textContent=score;be.textContent=best}btn.onclick=()=>{btn.disabled=true;show()};document.getElementById('reset').onclick=()=>{if(confirm('Starte på nytt?')){level=1;score=0;update();btn.textContent='START LEVEL 1';msg.textContent='Klar for ny runde.'}};update();</script></body></html>
