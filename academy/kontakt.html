<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kontakt | Henrik Academy</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#030b15;color:#f5f8fb}a{color:#9ed4ff}.top{border-bottom:1px solid #16354d;padding:22px 24px}.wrap{width:min(900px,calc(100% - 32px));margin:auto;padding:50px 0}.card{border:1px solid #16354d;background:linear-gradient(145deg,#0b1d2d,#06121e);border-radius:24px;padding:32px;margin-bottom:18px}h1{font-size:clamp(2.5rem,6vw,4.4rem);margin:.2em 0}.k{color:#13d9ff;font-size:.75rem;font-weight:800;letter-spacing:.14em}p{color:#b5c4d1;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:18px}label{display:block;font-weight:700;margin-bottom:8px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #23435c;background:#06131f;color:#fff;border-radius:12px;padding:14px 15px;font:inherit}textarea{min-height:150px;resize:vertical}button{width:100%;min-height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#218cff,#0874dc);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}.status{display:none;margin-top:16px;padding:14px;border-radius:12px}.ok{display:block;border:1px solid rgba(40,217,154,.3);background:rgba(40,217,154,.08);color:#c8f7e5}.err{display:block;border:1px solid rgba(255,107,107,.3);background:rgba(255,107,107,.08);color:#ffd1d1}.footer{color:#718496;padding:26px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="wrap" style="padding:0"><a href="/academy/">← Henrik Academy</a></div></div><main class="wrap"><div class="card"><div class="k">KONTAKT</div><h1>Kontakt Henrik</h1><p>Har du spørsmål om Henrik Academy, tilgang, faglig innhold, kilder eller personvern, kan du sende en melding her.</p></div><form id="f" class="card"><div class="grid"><div class="field"><label for="name">Navn *</label><input id="name" name="name" required maxlength="120"></div><div class="field"><label for="email">E-post *</label><input id="email" name="email" type="email" required maxlength="254"></div></div><div class="field"><label for="company">Virksomhet / organisasjon</label><input id="company" name="company" maxlength="160"></div><div class="field"><label for="message">Melding *</label><textarea id="message" name="message" required minlength="10" maxlength="5000" placeholder="Hva kan jeg hjelpe deg med?"></textarea></div><button id="b" type="submit">Send melding</button><div id="s" class="status"></div></form><div class="footer">Utviklet og administrert av Henrik Bergfjord · © 2026 Henrik Academy · ians.no</div></main><script>const f=document.getElementById('f'),b=document.getElementById('b'),s=document.getElementById('s');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;b.textContent='Sender …';s.className='status';const d=new FormData(f);try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:d.get('name'),email:d.get('email'),company:d.get('company'),message:d.get('message'),type:'privat',subject:'Kontakt – Henrik Academy',source:'/academy/kontakt.html'})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Kunne ikke sende meldingen.');f.reset();s.className='status ok';s.textContent='Takk. Meldingen er sendt.';}catch(err){s.className='status err';s.textContent=err.message||'Noe gikk galt.';}finally{b.disabled=false;b.textContent='Send melding';}});</script></body></html>
