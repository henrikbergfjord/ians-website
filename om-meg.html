(function () {
  const EN = {"← Tilbake til forsiden": "← Back to home", "MIN REISE · 2003 → 2026": "MY JOURNEY · 2003 → 2026", "Fra serverrom": "From server rooms", "til": "to", "KI.": "AI.", "Scroll reisen": "Explore the journey", "Teknologireisen fra 2003 til 2026": "The technology journey from 2003 to 2026", "fysisk": "physical", "virtuelt": "virtual", "Sky": "Cloud", "tjenester": "services", "koblet": "connected", "skape": "create", "DET BEGYNTE SOM ELEV": "IT STARTED AS A STUDENT", "Fra skolebenken til ansvar for skolens IT-drift.": "From the classroom to responsibility for the school's IT operations.", "DET FØRSTE STORE SKIFTET": "THE FIRST MAJOR SHIFT", "En feil pekte mot en helt ny måte å bygge IT på.": "A fault pointed toward an entirely new way of building IT.", "NÅ MÅTTE DET SKALERE": "NOW IT HAD TO SCALE", "Fra noen servere til hel infrastruktur.": "From a few servers to complete infrastructure.", "FRA SERVERROM TIL TJENESTER": "FROM SERVER ROOMS TO SERVICES", "IT flyttet gradvis ut av rommet.": "IT gradually moved out of the room.", "HYBRID BLIR NORMALEN": "HYBRID BECOMES THE NORM", "Skyen erstattet ikke alt. Den koblet seg på alt.": "The cloud did not replace everything. It connected to everything.", "SKYEN KOMMER TILBAKE TIL DATASENTERET": "THE CLOUD RETURNS TO THE DATA CENTER", "Moderne lokal infrastruktur – styrt som en del av skyen.": "Modern local infrastructure – managed as part of the cloud.", "TILBAKE TIL GRUNNMUREN": "BACK TO THE FOUNDATION", "Hybrid infrastruktur, backup og disaster recovery.": "Hybrid infrastructure, backup and disaster recovery.", "ET NYTT KAPITTEL": "A NEW CHAPTER", "Fra infrastrukturen bak systemene til infrastrukturen bak samfunnet.": "From the infrastructure behind systems to the infrastructure behind society.", "OG SÅ KOM KI": "AND THEN CAME AI", "Nå flyttes grensen": "Now the boundary moves", "én gang til.": "once again.", "Idé": "Idea", "Dialog med KI": "Dialogue with AI", "Bygge & teste": "Build & test", "Fungerende løsning": "Working solution", "23 år": "23 years", "DERFOR FINNES IANS": "WHY IANS EXISTS", "Et sted der ideer får lov til å bli virkelige.": "A place where ideas are allowed to become real.", "Prøve.": "Try.", "Bygge.": "Build.", "Lære.": "Learn.", "Dele.": "Share.", "Planlegging": "Planning", "Kraftsystem": "Power system", "Infrastruktur": "Infrastructure", "Læring": "Learning", "Serverrom": "Server room", "Nettverk": "Network", "Kjøling": "Cooling", "Driftsplanlegging": "Operations planning", "Datasenter": "Data center", "Hybrid infrastruktur": "Hybrid infrastructure", "Energi": "Energy", "Nettverkssegmentering": "Network segmentation", "Energiøkonomi": "Energy economics", "Standardisering": "Standardization", "IT-drift": "IT operations", "Fil/print": "File/print", "Virtualisering": "Virtualization", "Mer enn tjue år med teknologi har lært meg én ting: Det som virker stort og nytt i dag, blir fort grunnmuren vi bygger videre på i morgen. Dette er ikke hele CV-en min. Det er historien om noen av skiftene som formet måten jeg tenker på – og hvorfor IANS finnes.": "More than twenty years in technology have taught me one thing: what feels big and new today quickly becomes the foundation we build on tomorrow. This is not my complete CV. It is the story of some of the shifts that shaped how I think – and why IANS exists.", "Da jeg startet i IT, var infrastrukturen noe du kunne ta på.": "When I started in IT, infrastructure was something you could physically touch.", "Servere skulle bestilles, bæres inn, monteres, installeres og holdes i live. I dag kan jeg sitte med en idé, diskutere den med KI og bygge noe fungerende på en kveld. Mellom de to ytterpunktene ligger en ganske interessant reise.": "Servers had to be ordered, carried in, mounted, installed and kept alive. Today I can sit with an idea, discuss it with AI and build something that works in an evening. Between those two extremes lies a rather interesting journey.", "Mens jeg var elev ved Bergen Tekniske Fagskole i 2003–04 begynte jeg å drifte skolens IT-miljø på de to studiestedene i Strandgaten 193 og Margaretastredet. Det ga meg tidlig praktisk ansvar for servere, arbeidsstasjoner, nettverk og den daglige infrastrukturen – før jeg egentlig var ferdig med utdanningen.": "While I was a student at Bergen Technical College in 2003–04, I began operating the school's IT environment at its two campuses in Strandgaten 193 and Margaretastredet. It gave me hands-on responsibility for servers, workstations, networks and day-to-day infrastructure before I had even finished my education.", "Et av de første moderniseringsprosjektene startet med strømforbruket. Klasserommene hadde fortsatt CRT-skjermer og lange brukstider – enkelte dager var lokalene i bruk helt frem mot kl. 22. På BKK.no fant jeg en energiberegning der vi kunne sammenligne strømforbruket til eksisterende utstyr med nye LCD-skjermer, som jeg husker lå rundt 45 watt.": "One of the first modernization projects started with power consumption. The classrooms still had CRT monitors and long operating hours – on some days the rooms were in use until around 10 p.m. On BKK.no I found an energy calculator that let us compare the electricity use of the existing equipment with new LCD monitors, which I remember were rated at around 45 watts.", "Regnestykket viste en overraskende stor forskjell. Jeg husker ikke lenger alle forutsetningene vi la inn i kalkylen – blant annet om vi regnet med faktisk brukstid eller kontinuerlig drift. Det er tross alt mer enn tjue år siden.": "The calculation showed a surprisingly large difference. I no longer remember every assumption we entered – including whether we used actual operating hours or continuous operation. After all, it was more than twenty years ago.", "Men jeg husker resultatet: beregningen viste en tilbakebetalingstid på under to år, og skolen valgte å kjøpe inn komplette klassesett.": "But I remember the result: the calculation showed a payback period of less than two years, and the school decided to purchase complete classroom sets.", "Da utstyret kom, måtte det også settes effektivt i drift. Sammen med Norton Ghost brukte jeg imaging til å «tanke opp» hele klasserom med standardiserte installasjoner, fremfor å installere hver enkelt PC fra bunnen av.": "When the equipment arrived, it also had to be deployed efficiently. Using Norton Ghost, I used imaging to provision entire classrooms with standardized installations instead of installing every PC from scratch.", "Det ble en tidlig erfaring med to prinsipper som har fulgt meg videre:": "It became an early lesson in two principles that have stayed with me:", "Mål før du bestemmer deg – og standardiser det som kan standardiseres.": "Measure before you decide – and standardize what can be standardized.", "Hos itslearning møtte jeg et sikkerhetsproblem knyttet til DCOM i den eksisterende serverinfrastrukturen. I stedet for bare å reparere problemet anbefalte jeg å virtualisere de interne serverne med VMware.": "At itslearning I encountered a security problem related to DCOM in the existing server infrastructure. Instead of simply repairing the problem, I recommended virtualizing the internal servers with VMware.", "Det avgjørende var ikke bare å få færre fysiske bokser. Vi kunne ta et kontrollert utgangspunkt før oppgraderinger og patching, standardisere miljøene og komme raskere tilbake dersom noe gikk galt. Plutselig var en server ikke nødvendigvis en maskin.": "The key benefit was not simply having fewer physical boxes. We could create a controlled starting point before upgrades and patching, standardize environments and recover faster if something went wrong. Suddenly, a server was no longer necessarily a machine.", "itslearning vokste, og infrastrukturen måtte vokse med selskapet. Jeg arbeidet med design av nettverk, serverrom, kjøling, lagring og samband – og med planleggingen av en fysisk flytting der også e-postsystemet skulle over med svært begrenset nedetid.": "itslearning was growing, and the infrastructure had to grow with the company. I worked on the design of networks, server rooms, cooling, storage and connectivity – and planned a physical relocation in which the email system also had to move with very limited downtime.", "Her ble det tydelig at IT ikke bare handler om serveren. Strøm, kjøling, nettverk, leverandører, risiko, mennesker og tidspunkt må virke sammen.": "This made it clear that IT is about more than the server. Power, cooling, networks, suppliers, risk, people and timing all have to work together.", "De neste årene ble reisen en blanding av migreringer, virtualisering, terminalservere, datasentre og etter hvert skytjenester. Office 365 kom tidlig inn i bildet. E-post ble flyttet fra Domino til Exchange. Kundemiljøer ble flyttet til datasenter. VMware var blitt hverdagsverktøy.": "Over the following years, the journey became a mix of migrations, virtualization, terminal servers, data centers and eventually cloud services. Office 365 entered the picture early. Email moved from Domino to Exchange. Customer environments moved into data centers. VMware had become an everyday tool.", "Teknologien endret seg, men arbeidet handlet stadig mer om overgangen mellom gammelt og nytt – uten at virksomheten kunne stoppe mens vi gjorde det.": "The technology changed, but the work increasingly centered on the transition between old and new – without the business being able to stop while we made that transition.", "Arbeidet ble stadig mer hybrid: on-prem, Azure, Microsoft 365, identitet, MFA, Conditional Access, sikkerhet og automasjon. Nye tjenester måtte spille sammen med eksisterende systemer – ofte i miljøer der stabilitet og sikkerhet var viktigere enn å bruke det nyeste for enhver pris.": "The work became increasingly hybrid: on-premises, Azure, Microsoft 365, identity, MFA, Conditional Access, security and automation. New services had to work with existing systems – often in environments where stability and security mattered more than using the newest technology at any cost.", "I denne perioden arbeidet jeg også med virksomhetskritiske løsninger rundt fysisk handel i kraftmarkedet. Det gjorde koblingen mellom digital infrastruktur, sikker drift og den fysiske energiverdenen tydeligere.": "During this period I also worked with business-critical solutions supporting physical trading in the power market. It made the connection between digital infrastructure, reliable operations and the physical energy world much clearer.", "I et av mine siste prosjekter arbeidet jeg med design og workshopgrunnlag for en Azure Local-løsning: lokal compute, lagring og nettverk kombinert med styring, sikkerhet og tjenester gjennom Azure.": "In one of my final projects, I worked on design and workshop material for an Azure Local solution: local compute, storage and networking combined with management, security and services through Azure.", "Det interessante er hvordan reisen på mange måter binder seg sammen. Fra fysiske servere, via virtualisering og offentlig sky, til en moderne hybrid plattform der lokal infrastruktur igjen står sentralt – men nå med skyens styringsmodell rundt seg.": "What is interesting is how the journey comes full circle in many ways. From physical servers, through virtualization and public cloud, to a modern hybrid platform where local infrastructure is central again – now surrounded by the cloud's management model.", "Det siste året i konsulentrollen førte meg også tilbake til selve infrastrukturen: virtualisering, backup, gjenoppretting, nettverk og beredskap. Jeg arbeidet med en hybrid løsning der produksjon, lokal backup, offsite-kopi og disaster recovery måtte ses som én sammenhengende kjede.": "My final year in consulting also brought me back to infrastructure itself: virtualization, backup, recovery, networking and preparedness. I worked with a hybrid solution where production, local backup, an offsite copy and disaster recovery had to be treated as one continuous chain.", "En eksisterende VMware-plattform ble brukt som midlertidig DR-mål, samtidig som veien videre ble planlagt mot en moderne Hyper-V-basert løsning. Parallelt arbeidet jeg med nettverkssegmentering og tydeligere skille mellom produksjon, klienter, infrastruktur og andre soner.": "An existing VMware platform was used as a temporary DR target while the path forward was planned toward a modern Hyper-V-based solution. In parallel, I worked on network segmentation and clearer separation between production, clients, infrastructure and other zones.", "Faglig påfyll i 2026:": "Professional development in 2026:", "AZ-104 · AZ-800 · AZ-801 – Azure-administrasjon og hybride Windows Server-miljøer.": "AZ-104 · AZ-800 · AZ-801 – Azure administration and hybrid Windows Server environments.", "1. oktober 2026 begynner jeg som Planner i Statnett. Etter mange år med IT-infrastruktur, sky og løsninger rundt energimarkedet går reisen nærmere selve kraftsystemet.": "On 1 October 2026 I begin as a Planner at Statnett. After many years of IT infrastructure, cloud technology and solutions around the energy market, the journey moves closer to the power system itself.", "Det føles ikke som å forlate teknologien. Snarere som å følge den helt ned til grunnmuren: Datakraft trenger energi. Energi trenger nett. Og kapasitet må planlegges før den kan brukes.": "It does not feel like leaving technology. Rather, it feels like following it all the way down to the foundation: computing power needs energy. Energy needs a grid. And capacity must be planned before it can be used.", "Det største skiftet er kanskje ikke hva teknologien kan gjøre – men hva én person kan skape med den.": "Perhaps the biggest shift is not what technology can do – but what one person can create with it.", "Fra fysiske servere og virtualisering til hybrid infrastruktur, kraftsystemer og KI-assistert utvikling.": "From physical servers and virtualization to hybrid infrastructure, power systems and AI-assisted development.", "Jeg har sett fysiske servere bli virtuelle. Serverrom bli datasentre. Datasentre bli sky. Manuelle installasjoner bli automatisering. Men KI oppleves annerledes: teknologien kan nå være med i selve tanke- og skapelsesprosessen.": "I have seen physical servers become virtual. Server rooms become data centers. Data centers become cloud. Manual installations become automation. But AI feels different: technology can now take part in the thinking and creation process itself.", "🖥️ Måle → beregne → modernisere → drifte": "🖥️ Measure → calculate → modernize → operate", "«Hva bruker teknologien – og lønner det seg å gjøre dette på en bedre måte?»": "“What does the technology consume – and does it pay to do this in a better way?”", "💡 Idé → dialog med KI → bygge → teste → publisere": "💡 Idea → dialogue with AI → build → test → publish", "«Kan jeg beskrive ideen, diskutere den med KI – og bygge løsningen selv?»": "“Can I describe the idea, discuss it with AI – and build the solution myself?”", "IANS er mitt personlige laboratorium. Her kan en idé bli til kode, en nettside, et verktøy, en analyse eller et helt lite prosjekt. ChatGPT er en del av arbeidsmåten – ikke fordi KI gjør alt, men fordi avstanden fra idé til læring, utprøving og fungerende løsning har blitt dramatisk kortere.": "IANS is my personal laboratory. Here an idea can become code, a website, a tool, an analysis or an entire small project. ChatGPT is part of the way I work – not because AI does everything, but because the distance from idea to learning, experimentation and a working solution has become dramatically shorter.", "Åpne bildet i full størrelse": "Open image full size", "Illustrasjon av IT-miljøet ved starten av teknologireisen, med CRT-skjermer, arbeidsstasjoner og servere.": "Illustration of the IT environment at the start of the technology journey, with CRT monitors, workstations and servers.", "Illustrasjon til En feil pekte mot en helt ny måte å bygge IT på.": "Illustration for a fault pointing toward an entirely new way of building IT.", "Illustrasjon til Fra noen servere til hel infrastruktur.": "Illustration of the transition from a few servers to complete infrastructure.", "Illustrasjon til IT flyttet gradvis ut av rommet.": "Illustration of IT gradually moving out of the server room.", "Illustrasjon til Skyen erstattet ikke alt. Den koblet seg på alt.": "Illustration of the cloud connecting to existing infrastructure rather than replacing everything.", "Illustrasjon av moderne Azure Local-infrastruktur med tre noder, redundant nettverk og Azure-integrasjon": "Illustration of modern Azure Local infrastructure with three nodes, redundant networking and Azure integration", "Illustrasjon av hybrid infrastruktur, backup og disaster recovery.": "Illustration of hybrid infrastructure, backup and disaster recovery.", "Illustrasjon av kraftsystem, transmisjonsnett og planlegging.": "Illustration of the power system, transmission grid and planning.", "Fra idé via KI og kode til fungerende løsning": "From idea through AI and code to a working solution"};
  const ATTRS = ["aria-label","alt","title"];
  const originalText = new WeakMap();
  const originalAttrs = new WeakMap();

  function norm(s) { return (s || "").replace(/\s+/g," ").trim(); }

  function remember() {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walker.nextNode())) {
      if (norm(n.nodeValue)) originalText.set(n, n.nodeValue);
    }
    document.querySelectorAll("*").forEach(el => {
      const vals = {};
      ATTRS.forEach(a => { if (el.hasAttribute(a)) vals[a] = el.getAttribute(a); });
      if (Object.keys(vals).length) originalAttrs.set(el, vals);
    });
  }

  function setEnglish() {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walker.nextNode())) {
      const raw = originalText.get(n) ?? n.nodeValue;
      const key = norm(raw);
      if (EN[key]) {
        const lead = raw.match(/^\s*/)[0], tail = raw.match(/\s*$/)[0];
        n.nodeValue = lead + EN[key] + tail;
      }
    }
    document.querySelectorAll("*").forEach(el => {
      const vals = originalAttrs.get(el) || {};
      ATTRS.forEach(a => {
        const raw = vals[a];
        if (raw && EN[norm(raw)]) el.setAttribute(a, EN[norm(raw)]);
      });
    });
    document.documentElement.lang = "en";
    document.title = "Henrik Bergfjord · My journey · IANS";
  }

  function setNorwegian() {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walker.nextNode())) {
      if (originalText.has(n)) n.nodeValue = originalText.get(n);
    }
    document.querySelectorAll("*").forEach(el => {
      const vals = originalAttrs.get(el);
      if (vals) Object.entries(vals).forEach(([a,v]) => el.setAttribute(a,v));
    });
    document.documentElement.lang = "nb";
    document.title = "Henrik Bergfjord · Min reise · IANS";
  }

  function apply(lang) {
    lang = lang === "en" ? "en" : "no";
    if (lang === "en") setEnglish(); else setNorwegian();
    const no = document.getElementById("lang-no"), en = document.getElementById("lang-en");
    if (no && en) {
      no.classList.toggle("active", lang === "no");
      en.classList.toggle("active", lang === "en");
      no.setAttribute("aria-pressed", lang === "no" ? "true":"false");
      en.setAttribute("aria-pressed", lang === "en" ? "true":"false");
    }
    try { localStorage.setItem("ians-language", lang); } catch(e) {}
  }

  document.addEventListener("DOMContentLoaded", function() {
    remember();
    const no = document.getElementById("lang-no"), en = document.getElementById("lang-en");
    if (no) no.addEventListener("click", () => apply("no"));
    if (en) en.addEventListener("click", () => apply("en"));
    let saved = "no";
    try { saved = localStorage.getItem("ians-language") || "no"; } catch(e) {}
    apply(saved);
  });
})();
