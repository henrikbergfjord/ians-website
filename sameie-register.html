<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Grunnregister · SameieNett</title><style>:root{--bg:#04101a;--p:#0b1d2b;--l:#1c4059;--t:#f4f8fb;--m:#95aabb;--c:#55ddff;--g:#50e098}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061623,#030a11);color:var(--t);font-family:Inter,system-ui,sans-serif;min-height:100vh;padding:24px}.wrap{max-width:1160px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn,button{border:1px solid #26759d;background:#0b2940;color:white;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none}.card{background:#0a1b29;border:1px solid var(--l);border-radius:20px;padding:20px;margin-top:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab.active{border-color:var(--c);color:var(--c)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #24506b;background:#05141f;color:#fff}.muted{color:var(--m)}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:11px;border-bottom:1px solid #17354b;text-align:left}th{font-size:.72rem;color:#94adbd;text-transform:uppercase}.ok{color:var(--g)}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.card{overflow:auto}}</style></head><body><main class="wrap"><header class="top"><div><b>IANS · SAMEIENETT GRUNNREGISTER</b><div class="muted">Bolig, styre og kontrollhistorikk</div></div><a class="btn" href="/sameie-dashboard.html">← Dashboard</a></header><section class="card"><div class="tabs"><button class="tab active" data-tab="unit">Boliger</button><button class="tab" data-tab="member">Styre</button><button class="tab" data-tab="inspection">Kontrollhistorikk</button></div><div id="forms"><form id="unitForm" class="grid" style="margin-top:16px"><div class="field"><label>Oppgang</label><input id="entrance" placeholder="5D" required></div><div class="field"><label>Bruksenhet</label><input id="unitCode" placeholder="H0203" required></div><div class="field"><label>Leilighetsnummer</label><input id="apartmentNo" placeholder="2001"></div><div class="field"><label>Full adresse – kun admin</label><input id="unitAddress" placeholder="Straumsfjellvegen 5 D"></div><div class="full"><button>Lagre bolig</button></div></form><form id="memberForm" class="grid" style="margin-top:16px;display:none"><div class="field"><label>Navn</label><input id="memberName" required></div><div class="field"><label>E-post</label><input id="memberEmail" type="email" required></div><div class="field"><label>Rolle</label><select id="memberRole"><option>Styreleder</option><option>Styremedlem</option><option>Varamedlem</option><option>Forretningsfører</option></select></div><div class="field"><label>Tjenester</label><input id="memberServices" value="sprinkler,fire,yearwheel,maintenance"></div><div class="full"><button>Lagre styremedlem</button></div></form><form id="inspectionForm" class="grid" style="margin-top:16px;display:none"><div class="field"><label>Bolig-ID</label><input id="inspectionUnit" placeholder="5d-h0203" required></div><div class="field"><label>År</label><input id="inspectionYear" type="number" value="2026" required></div><div class="field"><label>Kontrolltype</label><select id="inspectionType"><option value="sprinkler">Sprinkler</option><option value="fire">Brannvarsling</option></select></div><div class="field"><label>Dato</label><input id="inspectionDate" type="date"></div><div class="field full"><label>Kilde/notat</label><textarea id="inspectionSource" placeholder="Rapport, leverandør eller kommentar"></textarea></div><div class="full"><button>Lagre kontroll</button></div></form></div><div id="status" class="muted" style="margin-top:12px"></div></section><section class="card"><h2 id="listTitle">Boliger</h2><div id="list" class="muted">Laster …</div></section></main><script>const sameie='straumsfjellet-panorama';let current='unit';const $=id=>document.getElementById(id);async function api(action,opts={}){const r=await fetch(`/api/sameie-core?sameie=${sameie}&action=${action}`,opts),j=await r.json();if(!r.ok)throw Error(j.error||'Feil');return j}function setStatus(t,ok=false){status.className=ok?'ok':'muted';status.textContent=t}async function load(){if(current==='unit'){listTitle.textContent='Boliger';const j=await api('units');list.innerHTML=j.units.length?`<table><thead><tr><th>Oppgang</th><th>Bruksenhet</th><th>Leilighet</th><th>Adresse (admin)</th></tr></thead><tbody>${j.units.map(x=>`<tr><td>${x.entrance}</td><td><b>${x.unitCode}</b></td><td>${x.apartmentNo||'—'}</td><td>${x.address||'—'}</td></tr>`).join('')}</tbody></table>`:'Ingen boliger er importert til ny kjernemodell ennå.'}else if(current==='member'){listTitle.textContent='Styremedlemmer';const j=await api('members');list.innerHTML=j.members.length?`<table><thead><tr><th>Navn</th><th>E-post</th><th>Rolle</th><th>Tjenester</th></tr></thead><tbody>${j.members.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.role}</td><td>${x.services.join(', ')}</td></tr>`).join('')}</tbody></table>`:'Ingen styremedlemmer er lagt inn i kjerneregisteret ennå.'}else{listTitle.textContent='Kontrollhistorikk';const j=await api('inspections');list.innerHTML=j.inspections.length?`<table><thead><tr><th>Bolig</th><th>År</th><th>Type</th><th>Dato</th><th>Kilde</th></tr></thead><tbody>${j.inspections.map(x=>`<tr><td>${x.unitId}</td><td>${x.year}</td><td>${x.type}</td><td>${x.date||'—'}</td><td>${x.source||'—'}</td></tr>`).join('')}</tbody></table>`:'Ingen kontrollhistorikk er importert til kjerneregisteret ennå.'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));unitForm.style.display=current==='unit'?'grid':'none';memberForm.style.display=current==='member'?'grid':'none';inspectionForm.style.display=current==='inspection'?'grid':'none';load().catch(e=>setStatus(e.message))});unitForm.onsubmit=async e=>{e.preventDefault();await api('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sameie,type:'unit',entrance:entrance.value,unitCode:unitCode.value,apartmentNo:apartmentNo.value,address:unitAddress.value})});setStatus('Boligen er lagret.',true);e.target.reset();load()};memberForm.onsubmit=async e=>{e.preventDefault();await api('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sameie,type:'member',name:memberName.value,email:memberEmail.value,role:memberRole.value,services:memberServices.value.split(',').map(x=>x.trim())})});setStatus('Styremedlemmet er lagret.',true);e.target.reset();load()};inspectionForm.onsubmit=async e=>{e.preventDefault();await api('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sameie,type:'inspection',unitId:inspectionUnit.value,year:inspectionYear.value,inspectionType:inspectionType.value,date:inspectionDate.value,source:inspectionSource.value})});setStatus('Kontrollen er lagret.',true);load()};fetch('/.auth/me').then(r=>r.json()).then(j=>{if(!j.clientPrincipal)location.href='/.auth/login/aad?post_login_redirect_uri=/sameie-register.html';else load().catch(e=>setStatus(e.message))});</script></body></html>
