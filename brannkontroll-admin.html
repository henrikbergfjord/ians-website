<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Brannkontroll Admin · IANS</title><style>:root{--b:#07111c;--p:#0d1d2b;--l:#ffffff18;--t:#eef7ff;--m:#8fa6b8;--c:#6be4ff;--g:#78e4a7;--r:#ff8d98}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#17364e,#07111c 42%,#040a10);color:var(--t);font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(1320px,calc(100% - 24px));margin:auto;padding:28px 0 60px}.card{background:linear-gradient(180deg,#102536f5,#081723f5);border:1px solid var(--l);border-radius:22px}.panel{padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.btn,button{border:1px solid #2d749f;background:#0b2940;color:white;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none}.danger{background:#ff8d9817;color:#ffd5d9;border-color:#ff8d9838}.muted{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{padding:16px}.stat b{display:block;font-size:1.5rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.toolbar input{max-width:420px;width:100%;padding:12px;background:#071521;border:1px solid var(--l);border-radius:11px;color:white}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:1150px}th,td{padding:12px;border-bottom:1px solid var(--l);text-align:left}th{font-size:.72rem;color:#93adbf;text-transform:uppercase}.notice{padding:18px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><div><b>IANS · BRANNKONTROLL ADMIN</b><div class="muted">Straumsfjellet Panorama Sameie · Microsoft-sikret styretilgang</div></div><div><a class="btn" href="/teknisk.html">← Teknisk</a> <button id="refresh">Oppdater</button> <a class="btn" href="/.auth/logout?post_logout_redirect_uri=/teknisk.html">Logg ut</a></div></header><div id="gate" class="card notice" style="margin-top:18px">Kontrollerer styretilgang …</div><main id="app" hidden><section class="stats" id="stats"></section><section class="card panel"><div class="toolbar"><input id="search" placeholder="Søk navn, adresse, leilighet, e-post, telefon eller tidsintervall"><button id="csv">Eksporter CSV</button><span class="muted" id="count"></span></div><div class="tablewrap"><table><thead><tr><th>Navn</th><th>Adresse</th><th>Leilighet</th><th>Bruksenhet</th><th>Telefon</th><th>E-post</th><th>Dag</th><th>Tidsintervall</th><th>Registrert</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let DATA=[];async function access(){const me=await fetch('/.auth/me').then(r=>r.json());if(!me.clientPrincipal){location.href='/.auth/login/aad?post_login_redirect_uri=/brannkontroll-admin.html';return false}const r=await fetch('/api/sameie-access?sameie=straumsfjellet-panorama&service=fire'),j=await r.json();if(!j.approved){gate.innerHTML='Du har ikke godkjent styretilgang til brannkontrolladministrasjonen. <a href="/sameie-styretilgang.html" style="color:#6be4ff">Be om tilgang</a>.';return false}gate.hidden=true;app.hidden=false;return true}async function load(){if(!await access())return;const r=await fetch('/api/firebooking?admin=1',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Kunne ikke hente bookinger');DATA=j.bookings||[];stats.innerHTML=[['Booket',j.totalBooked||0],...(j.windows||[]).map(x=>[x.window,x.booked])].map(([a,b])=>`<div class="card stat"><span class="muted">${esc(a)}</span><b>${esc(b)}</b></div>`).join('');render()}function filtered(){const q=search.value.toLowerCase();return !q?DATA:DATA.filter(x=>`${x.name} ${x.address} ${x.unit} ${x.bruksenhet} ${x.phone} ${x.email} ${x.day} ${x.window}`.toLowerCase().includes(q))}function render(){const a=filtered();count.textContent=`${a.length} bookinger`;rows.innerHTML=a.map(x=>`<tr><td>${esc(x.name||'—')}</td><td>${esc(x.address||'—')}</td><td><b>${esc(x.unit)}</b></td><td>${esc(x.bruksenhet||'')}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.day)}</td><td>${esc(x.window)}</td><td>${esc(new Date(x.updatedAt||x.createdAt).toLocaleString('no-NO'))}</td><td><button class="danger" data-del="${esc(x.unit)}">Slett</button></td></tr>`).join('')||'<tr><td colspan="10" class="muted">Ingen bookinger.</td></tr>'}search.oninput=render;refresh.onclick=()=>load().catch(e=>gate.textContent=e.message);rows.onclick=async e=>{const b=e.target.closest('[data-del]');if(!b||!confirm('Slette booking for '+b.dataset.del+'?'))return;await fetch('/api/firebooking',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({unit:b.dataset.del})});await load()};csv.onclick=()=>{const r=[['Navn','Adresse','Leilighet','Bruksenhet','Telefon','E-post','Dag','Tidsintervall','Registrert'],...filtered().map(x=>[x.name||'',x.address||'',x.unit,x.bruksenhet||'',x.phone||'',x.email||'',x.day,x.window,x.updatedAt||x.createdAt])],csv='\ufeff'+r.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='brannkontroll-booking.csv';a.click()};load().catch(e=>gate.textContent=e.message);</script></body></html>
