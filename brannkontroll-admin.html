<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IANS Booking Admin – brannkontroll</title><style>:root{--bg:#07111c;--card:#0d1d2b;--line:#ffffff18;--text:#eef7ff;--muted:#8fa6b8;--cyan:#6be4ff;--green:#78e4a7;--red:#ff8d98}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#17364e,#07111c 42%,#040a10);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(1240px,calc(100% - 24px));margin:auto;padding:28px 0 60px}.card{background:linear-gradient(180deg,#102536f5,#081723f5);border:1px solid var(--line);border-radius:22px}.login{max-width:520px;margin:10vh auto;padding:28px}.panel{padding:22px}.hidden{display:none!important}input,button{font:inherit}input{width:100%;padding:13px;background:#071521;border:1px solid var(--line);border-radius:12px;color:white}button{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer;background:linear-gradient(#86edff,#48b8de);color:#03111b}.secondary{background:#ffffff10;color:#d8e8f2;border:1px solid var(--line)}.danger{background:#ff8d9817;color:#ffd5d9;border:1px solid #ff8d9838}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{padding:16px}.stat b{display:block;font-size:1.55rem}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.toolbar input{max-width:360px}.tablewrap{overflow:auto;border-radius:16px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{font-size:.72rem;text-transform:uppercase;color:#93adbf}.pill{display:inline-block;border:1px solid #6be4ff38;background:#6be4ff10;color:#bff4ff;padding:5px 8px;border-radius:999px}.notice{padding:12px;border-radius:12px;margin-top:12px}.ok{background:#78e4a712;color:#c9f4d8}.err{background:#ff8d9812;color:#ffd3d7}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><section id="login" class="card login"><div style="color:var(--cyan);font-size:.72rem;font-weight:900;letter-spacing:.14em">STRAUMSFJELLET PANORAMA SAMEIE</div><h1>🔥 Brannkontroll Admin</h1><p class="muted">Kun for autoriserte styremedlemmer. Administratorpassordet er separat fra beboerpassordet.</p><input id="key" type="password" placeholder="Administratorpassord" autocomplete="current-password" style="margin:8px 0 12px"><button id="loginBtn">Åpne administrasjon</button><div id="loginMsg"></div></section><main id="app" class="hidden"><header class="top"><div><b>IANS BOOKING ADMIN</b><div class="muted">Årlig brann- og sikkerhetskontroll 2026</div></div><div><button class="secondary" id="refresh">Oppdater</button> <button class="secondary" id="logout">Logg ut</button></div></header><section class="stats" id="stats"></section><section class="card panel"><div class="toolbar"><input id="search" placeholder="Søk leilighet, dag eller tidsintervall"><button id="csv">Eksporter CSV</button><span class="muted" id="count"></span></div><div class="tablewrap"><table><thead><tr><th>Leilighet</th><th>Bruksenhet</th><th>Dag</th><th>Tidsintervall</th><th>Registrert</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="msg"></div></section></main></div><script>const API='/api/firebooking';let KEY=sessionStorage.getItem('iansFireAdminKey')||'',DATA=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(el,t,ok=false){el.innerHTML=t?`<div class="notice ${ok?'ok':'err'}">${esc(t)}</div>`:''}async function load(){const r=await fetch(API+'?admin=1',{headers:{'x-admin-key':KEY},cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Kunne ikke hente bookinger.');DATA=j.bookings||[];$('stats').innerHTML=[['Booket',j.totalBooked||0],...((j.windows||[]).map(x=>[x.window,x.booked]))].map(([a,b])=>`<div class="card stat"><span class="muted">${esc(a)}</span><b>${esc(b)}</b></div>`).join('');render()}function filtered(){const q=$('search').value.toLowerCase();return !q?DATA:DATA.filter(x=>`${x.unit} ${x.bruksenhet||''} ${x.day} ${x.window}`.toLowerCase().includes(q))}function render(){const a=filtered();$('count').textContent=`${a.length} bookinger`;$('rows').innerHTML=a.map(x=>`<tr><td><strong>${esc(x.unit)}</strong></td><td>${esc(x.bruksenhet)}</td><td>${esc(x.day)}</td><td><span class="pill">${esc(x.window)}</span></td><td>${esc(new Date(x.createdAt).toLocaleString('no-NO'))}</td><td><button class="danger" data-del="${esc(x.unit)}">Slett</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Ingen bookinger ennå.</td></tr>'}async function enter(){KEY=$('key').value.trim();if(!KEY)return note($('loginMsg'),'Skriv inn administratorpassord.');try{await load();sessionStorage.setItem('iansFireAdminKey',KEY);$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){note($('loginMsg'),e.message)}}$('loginBtn').onclick=enter;$('key').onkeydown=e=>{if(e.key==='Enter')enter()};$('refresh').onclick=()=>load().catch(e=>note($('msg'),e.message));$('logout').onclick=()=>{sessionStorage.removeItem('iansFireAdminKey');location.reload()};$('search').oninput=render;$('rows').onclick=async e=>{const b=e.target.closest('[data-del]');if(!b)return;if(!confirm('Slette booking for leilighet '+b.dataset.del+'?'))return;const r=await fetch(API,{method:'DELETE',headers:{'content-type':'application/json','x-admin-key':KEY},body:JSON.stringify({unit:b.dataset.del})}),j=await r.json().catch(()=>({}));if(!r.ok)return note($('msg'),j.error||'Kunne ikke slette.');note($('msg'),'Bookingen er slettet.',true);await load()};$('csv').onclick=()=>{const rows=[['Leilighet','Bruksenhet','Dag','Tidsintervall','Registrert'],...filtered().map(x=>[x.unit,x.bruksenhet||'',x.day,x.window,x.createdAt])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='brannkontroll-booking-2026.csv';a.click()};if(KEY){$('key').value=KEY;enter()}</script></body></html>
