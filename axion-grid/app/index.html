<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Axion Grid | Opening</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020912;color:#f5f8fb;font-family:Inter,system-ui}.box{text-align:center;padding:38px}.mark{font-size:34px;color:#18d7f5}.muted{color:#9db0bf;margin-top:10px}</style></head><body><div class="box"><div class="mark">◈</div><h1>Åpner privat område …</h1><div class="muted" id="s">Kontrollerer Microsoft-identitet og tilgang.</div></div><script>(async()=>{try{const d=await (await fetch('/.auth/me',{cache:'no-store'})).json(),p=d.clientPrincipal;if(!p){location.replace('/.auth/login/aad?post_login_redirect_uri=/axion-grid/app/');return}const r=(p.userRoles||[]).map(x=>String(x).toLowerCase());if(r.includes('axionadmin')||r.includes('axionowner')){location.replace('/axion-grid/admin/');return}if(r.includes('axioncustomer')){location.replace('/axion-grid/customer/');return}if(r.includes('axionuser')){location.replace('/axion-grid/workspace/');return}location.replace('/axion-grid/?access=pending')}catch(e){document.getElementById('s').textContent='Kunne ikke kontrollere tilgang. Prøv å logge inn på nytt.'}})();</script></body></html>
