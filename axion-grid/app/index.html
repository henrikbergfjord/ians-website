<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Axion Grid | Åpner</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,#0a456044,transparent 35%),#020912;color:#f5f8fb;font-family:Inter,system-ui}.box{text-align:center;padding:38px}.mark{font-size:36px;color:#18d7f5}.muted{color:#9db0bf;margin-top:10px;line-height:1.6}.btn{display:inline-flex;margin-top:20px;padding:12px 16px;border-radius:11px;background:#168cff;color:#fff;text-decoration:none;font-weight:800}</style></head><body><div class="box"><div class="mark">◈</div><h1>Åpner Axion Grid …</h1><div class="muted" id="s">Kontrollerer Microsoft-identitet og tilgang.</div><a id="login" class="btn" style="display:none" href="/.auth/login/aad?post_login_redirect_uri=/axion-grid/customer/">Logg inn med Microsoft</a></div><script>(async()=>{try{const d=await (await fetch('/.auth/me',{cache:'no-store'})).json(),p=d.clientPrincipal;if(!p){document.getElementById('s').textContent='Du må identifisere deg med Microsoft før det private området kan åpnes.';document.getElementById('login').style.display='inline-flex';return}const r=(p.userRoles||[]).map(x=>String(x).toLowerCase()),ok=r.some(x=>['axionuser','axioncustomer','axionadmin','axionowner'].includes(x));if(ok){location.replace('/axion-grid/customer/');return}location.replace('/axion-grid/?access=pending')}catch{document.getElementById('s').textContent='Kunne ikke kontrollere tilgang akkurat nå. Prøv igjen.';document.getElementById('login').style.display='inline-flex'}})();</script></body></html>
