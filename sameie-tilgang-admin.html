<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sameie tilgangsadmin · IANS</title><style>:root{--b:#06111c;--p:#0b1927;--l:#ffffff18;--t:#eef7ff;--m:#8da5b8;--c:#6be4ff;--g:#74e6a7;--r:#ff8b96}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#12314a,#071521 38%,#040b12);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1200px,calc(100% - 24px));margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;align-items:center}.btn,button{border:1px solid #2d749f;background:#0b2940;color:white;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;text-decoration:none}.card{border:1px solid var(--l);background:#0b1927;border-radius:18px;padding:18px;margin-top:16px}.muted{color:var(--m)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--l)}th{font-size:.75rem;color:#9ab0c0}.ok{color:var(--g)}.bad{color:var(--r)}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{font-size:.8rem;color:#b8c8d3}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column;gap:10px}.card{overflow:auto}}</style></head><body><main class="wrap"><header class="top"><div><h1>Sameie · tilgangsadmin</h1><div class="muted">Godkjenn styremedlemmer for sprinkler, brannkontroll og årshjul.</div></div><div><a class="btn" href="/teknisk.html">← Teknisk</a> <a class="btn" href="/.auth/logout?post_logout_redirect_uri=/teknisk.html">Logg ut</a></div></header><div id="msg" class="card">Laster forespørsler …</div><section class="card"><h2>Tilgangsforespørsler</h2><div id="requests"></div></section><section class="card"><h2>Godkjente brukere</h2><div id="approved"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let DATA;async function load(){const me=await fetch('/.auth/me').then(r=>r.json());if(!me.clientPrincipal){location.href='/.auth/login/aad?post_login_redirect_uri=/sameie-tilgang-admin.html';return}const r=await fetch('/api/sameie-access?admin=1&sameie=straumsfjellet-panorama'),j=await r.json();if(!r.ok){msg.innerHTML='<span class="bad">'+esc(j.error||'Ingen tilgang')+'</span>';return}DATA=j;msg.innerHTML='<span class="ok">Innlogget som sameieadmin.</span>';render()}function render(){requests.innerHTML=DATA.requests.length?`<table><thead><tr><th>Navn</th><th>E-post</th><th>Rolle</th><th>Ønsker</th><th>Status</th><th></th></tr></thead><tbody>${DATA.requests.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${esc(x.message)}</td><td>${esc(x.status)}</td><td>${x.status==='pending'?`<button onclick="approve('${x.id}','${esc(x.email)}','${esc(x.role)}')">Godkjenn</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">Ingen forespørsler.</div>';approved.innerHTML=DATA.approved.length?`<table><thead><tr><th>E-post</th><th>Rolle</th><th>Tjenester</th><th>Status</th></tr></thead><tbody>${DATA.approved.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${esc((x.services||[]).join(', '))}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table>`:'<div class="muted">Ingen godkjente brukere ennå.</div>'}async function approve(id,email,role){const services=['sprinkler','fire','yearwheel'];const r=await fetch('/api/sameie-access',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({sameie:'straumsfjellet-panorama',requestId:id,email,role,services,approved:true})}),j=await r.json();if(!r.ok)return alert(j.error||'Kunne ikke godkjenne');await load()}load();</script></body></html>
