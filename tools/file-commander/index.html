<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IANS File Commander V2</title><style>:root{--bg:#030b15;--panel:#081725;--panel2:#06111c;--line:#183b58;--blue:#2c95ff;--cyan:#19d7ff;--text:#eff7ff;--muted:#8fa4b7;--green:#4ade9a;--amber:#ffcb68;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#0d3155,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-rows:52px auto auto 1fr 32px}.top{padding:0 16px;border-bottom:1px solid #102b42;background:#020914;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:.9rem}.brand span{color:var(--cyan)}.toplinks{display:flex;gap:8px;align-items:center}.top a{color:#9dcfff;text-decoration:none;font-size:.72rem}.toolbar,.smartbar{padding:7px 10px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #102b42;background:#05111c;overflow-x:auto}.smartbar{background:#04101a}.btn{white-space:nowrap;border:1px solid #245070;background:#0a1d2d;color:#d8ecfb;border-radius:7px;padding:7px 9px;cursor:pointer;font-size:.7rem}.btn:hover{border-color:#3a91cb}.btn.primary{background:#1478dd;border-color:#2e96fb;color:white}.btn.smart{color:#a9e8ff;border-color:#1d5d7e}.btn.danger{border-color:#6c3940;color:#ffb5b5}.search{margin-left:auto;min-width:180px;padding:7px 9px;border:1px solid #244965;border-radius:7px;background:#030c15;color:white;font-size:.7rem}.panes{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}.pane{min-width:0;display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}.pane.active{border-color:#2c95ff;box-shadow:0 0 0 1px #2c95ff55}.panehead{padding:8px;border-bottom:1px solid #17354e;background:#081929;display:grid;grid-template-columns:auto auto 1fr auto;gap:7px;align-items:center}.drive{font-size:.65rem;font-weight:900;color:#71c7ff}.path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9eb3c4;font-size:.7rem}.pick{border:1px solid #28618c;background:#0c2740;color:#bfe4ff;border-radius:6px;padding:5px 7px;cursor:pointer;font-size:.66rem}.list{overflow:auto}.row{display:grid;grid-template-columns:27px minmax(150px,1fr) 85px 125px;gap:7px;align-items:center;padding:7px 9px;border-bottom:1px solid #ffffff0b;font-size:.72rem;cursor:default;user-select:none}.row:hover{background:#0b2235}.row.selected{background:#123a5d}.row.folder .name{color:#8ed3ff;font-weight:700}.row.diff{box-shadow:inset 3px 0 var(--amber)}.row.same{box-shadow:inset 3px 0 var(--green)}.ico{font-size:14px}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size,.date{color:#7991a5;text-align:right;font-variant-numeric:tabular-nums}.empty{padding:40px;text-align:center;color:#6f879a}.status{padding:0 12px;border-top:1px solid #102b42;background:#020914;display:flex;align-items:center;justify-content:space-between;color:#8097aa;font-size:.66rem}.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:20}.overlay.open{display:block}.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 30px));max-height:80vh;overflow:auto;padding:20px;border:1px solid #245070;border-radius:14px;background:#071522;box-shadow:0 30px 80px #000}.dialog.small{width:min(440px,calc(100% - 30px))}.dialog h3{margin:0 0 12px}.dialog input,.dialog textarea{width:100%;padding:9px;border:1px solid #244965;border-radius:8px;background:#030c15;color:white}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.report{display:grid;gap:7px}.report div{padding:9px;border:1px solid #17354e;border-radius:8px;background:#05111c;font-size:.72rem}.report b{color:#8ed3ff}.preview pre{white-space:pre-wrap;word-break:break-word;color:#c8d7e4;font-size:.75rem;max-height:55vh;overflow:auto}.preview img{max-width:100%;max-height:55vh;display:block;margin:auto}.contact-tab{position:fixed;right:12px;bottom:42px;z-index:12}.contact-card{display:grid;gap:8px}.contact-card p{color:#91a6b8;font-size:.76rem;line-height:1.5}.legend{color:#71899b;font-size:.65rem;margin-left:4px}@media(max-width:800px){body{overflow:auto}.app{height:auto;min-height:100vh}.panes{grid-template-columns:1fr;min-height:900px}.pane{min-height:430px}.row{grid-template-columns:25px minmax(120px,1fr) 70px}.date{display:none}.search{min-width:130px}.smartbar{flex-wrap:wrap}.contact-tab{bottom:10px}}</style></head><body><div class="app"><header class="top"><div class="brand">IANS <span>FILE COMMANDER V2</span></div><div class="toplinks"><span class="legend">Lokalt · ingen opplasting</span><a href="/teknisk.html">← IANS Teknisk</a></div></header><div class="toolbar"><button class="btn primary" id="copy">F5 Kopier →</button><button class="btn" id="move">F6 Flytt →</button><button class="btn" id="mkdir">F7 Ny mappe</button><button class="btn" id="rename">Gi nytt navn</button><button class="btn danger" id="remove">Slett</button><input class="search" id="search" placeholder="Søk i aktiv mappe…"></div><div class="smartbar"><button class="btn smart" id="preview">👁 Preview</button><button class="btn smart" id="hash"># SHA-256</button><button class="btn smart" id="compare">⇄ Sammenlign</button><button class="btn smart" id="dupes">⧉ Duplikater</button><button class="btn smart" id="sync">↔ Synk forslag</button><button class="btn smart" id="refresh">↻ Oppdater</button><span class="legend">Sammenlign bruker navn, type, størrelse og dato. Duplikater bekreftes med SHA-256.</span></div><main class="panes"><section class="pane active" id="left" data-side="left"><div class="panehead"><span class="drive">VENSTRE</span><button class="pick up">↑</button><span class="path">Ingen mappe valgt</span><button class="pick choose">Velg mappe</button></div><div class="list"><div class="empty">Velg en lokal mappe for å starte.</div></div></section><section class="pane" id="right" data-side="right"><div class="panehead"><span class="drive">HØYRE</span><button class="pick up">↑</button><span class="path">Ingen mappe valgt</span><button class="pick choose">Velg mappe</button></div><div class="list"><div class="empty">Velg en annen mappe.</div></div></section></main><footer class="status"><span id="status">Klar · filer behandles lokalt i nettleseren</span><span id="support"></span></footer></div><button class="btn contact-tab" id="help">? Hjelp / Kontakt</button><div class="overlay" id="overlay"><div class="dialog" id="dialog"><div id="dialogBody"></div><div class="actions"><button class="btn" id="closeDialog">Lukk</button></div></div></div><script>const FS=!!window.showDirectoryPicker,$=s=>document.querySelector(s),state={left:{handle:null,root:null,stack:[],items:[],selected:null,filter:''},right:{handle:null,root:null,stack:[],items:[],selected:null,filter:''}};let active='left';$('#support').textContent=FS?'File System Access: klar':'Bruk Edge/Chrome på PC/Mac';const fmt=n=>{if(n==null)return'';for(const u of ['B','KB','MB','GB','TB']){if(n<1024)return(n<10&&u!=='B'?n.toFixed(1):Math.round(n))+' '+u;n/=1024}return n.toFixed(1)+' PB'},dt=t=>t?new Date(t).toLocaleString('nb-NO',{dateStyle:'short',timeStyle:'short'}):'';function setStatus(t){$('#status').textContent=t}function activate(side){active=side;document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.dataset.side===side));$('#search').value=state[side].filter||''}async function pick(side){if(!FS)return alert('Krever Edge/Chrome med File System Access API.');try{const h=await showDirectoryPicker({mode:'readwrite'});Object.assign(state[side],{handle:h,root:h,stack:[],selected:null});await refresh(side)}catch(e){if(e.name!=='AbortError')setStatus(e.message)}}async function refresh(side){const s=state[side],rows=[];if(!s.handle)return;for await(const [name,h]of s.handle.entries()){let size=null,modified=null;if(h.kind==='file'){try{const f=await h.getFile();size=f.size;modified=f.lastModified}catch{}}rows.push({name,handle:h,kind:h.kind,size,modified})}rows.sort((a,b)=>a.kind===b.kind?a.name.localeCompare(b.name,'nb'):a.kind==='directory'?-1:1);s.items=rows;render(side)}function render(side){const s=state[side],pane=$('#'+side),list=pane.querySelector('.list'),q=(s.filter||'').toLowerCase(),rows=s.items.filter(x=>!q||x.name.toLowerCase().includes(q));pane.querySelector('.path').textContent=[s.root?.name,...s.stack.map(x=>x.name)].filter(Boolean).join(' / ')||'Ingen mappe valgt';list.innerHTML=rows.length?'':'<div class="empty">'+(s.handle?'Ingen treff / mappen er tom.':'Velg mappe.')+'</div>';rows.forEach(it=>{const r=document.createElement('div');r.className='row '+(it.kind==='directory'?'folder':'');r.dataset.name=it.name;r.innerHTML='<span class="ico">'+(it.kind==='directory'?'📁':'📄')+'</span><span class="name"></span><span class="size">'+fmt(it.size)+'</span><span class="date">'+dt(it.modified)+'</span>';r.querySelector('.name').textContent=it.name;r.onclick=()=>{activate(side);s.selected=it;list.querySelectorAll('.row').forEach(x=>x.classList.remove('selected'));r.classList.add('selected');setStatus(it.name+(it.kind==='file'?' · '+fmt(it.size):' · mappe'))};r.ondblclick=async()=>{if(it.kind==='directory'){s.stack.push({name:it.name,handle:s.handle});s.handle=it.handle;s.selected=null;await refresh(side)}else{await showPreview(it)}};list.appendChild(r)});setStatus(side.toUpperCase()+': '+rows.length+' av '+s.items.length+' elementer')}async function up(side){const s=state[side];if(!s.stack.length)return setStatus('Du er på valgt rotmappe.');const p=s.stack.pop();s.handle=p.handle;s.selected=null;await refresh(side)}async function copyEntry(src,dst,name,newName=name){if(src.kind==='file'){const f=await src.getFile(),out=await dst.getFileHandle(newName,{create:true}),w=await out.createWritable();await w.write(await f.arrayBuffer());await w.close()}else{const d=await dst.getDirectoryHandle(newName,{create:true});for await(const [n,h]of src.entries())await copyEntry(h,d,n)}}async function transfer(move=false){const from=state[active],other=active==='left'?'right':'left',to=state[other];if(!from.selected||!to.handle)return setStatus('Velg et element og åpne begge paneler.');try{setStatus((move?'Flytter ':'Kopierer ')+from.selected.name+'…');await copyEntry(from.selected.handle,to.handle,from.selected.name);if(move)await from.handle.removeEntry(from.selected.name,{recursive:true});from.selected=null;await Promise.all([refresh(active),refresh(other)]);setStatus(move?'Flytting ferdig.':'Kopiering ferdig.')}catch(e){setStatus('Operasjonen feilet: '+e.message)}}function openDialog(html,small=false){$('#dialogBody').innerHTML=html;$('#dialog').classList.toggle('small',small);$('#overlay').classList.add('open')}function closeDialog(){$('#overlay').classList.remove('open')}function promptBox(title,value,cb){openDialog('<h3>'+title+'</h3><input id="promptInput">',true);const i=$('#promptInput');i.value=value||'';i.focus();i.select();const go=async e=>{if(e.key&&e.key!=='Enter')return;const v=i.value.trim();if(v){closeDialog();await cb(v)}};i.onkeydown=go}async function digestFile(h){const f=await h.getFile(),buf=await f.arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}async function showPreview(it){if(!it||it.kind!=='file')return setStatus('Velg en fil for Preview.');const f=await it.handle.getFile(),url=URL.createObjectURL(f);if(f.type.startsWith('image/'))openDialog('<h3>Preview · '+esc(it.name)+'</h3><div class="preview"><img src="'+url+'"></div>');else if(f.type.startsWith('text/')||/\.(txt|md|json|csv|log|js|css|html|xml|yml|yaml)$/i.test(it.name)){const text=await f.text();openDialog('<h3>Preview · '+esc(it.name)+'</h3><div class="preview"><pre>'+esc(text.slice(0,250000))+'</pre></div>')}else openDialog('<h3>Preview · '+esc(it.name)+'</h3><div class="report"><div><b>Type</b> '+esc(f.type||'ukjent')+'</div><div><b>Størrelse</b> '+fmt(f.size)+'</div><div><b>Endret</b> '+dt(f.lastModified)+'</div></div>',true)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function compare(){if(!state.left.handle||!state.right.handle)return setStatus('Åpne mapper i begge paneler først.');await Promise.all([refresh('left'),refresh('right')]);document.querySelectorAll('.row').forEach(r=>r.classList.remove('diff','same'));const L=new Map(state.left.items.map(x=>[x.name,x])),R=new Map(state.right.items.map(x=>[x.name,x]));let same=0,diff=0,leftOnly=0,rightOnly=0;for(const [n,a]of L){const b=R.get(n);let cls='diff';if(!b)leftOnly++;else if(a.kind===b.kind&&(a.kind==='directory'||a.size===b.size)){cls='same';same++}else diff++;document.querySelector('#left .row[data-name="'+CSS.escape(n)+'"]')?.classList.add(cls);if(b)document.querySelector('#right .row[data-name="'+CSS.escape(n)+'"]')?.classList.add(cls)}for(const [n]of R)if(!L.has(n)){rightOnly++;document.querySelector('#right .row[data-name="'+CSS.escape(n)+'"]')?.classList.add('diff')}openDialog('<h3>Mappe-sammenligning</h3><div class="report"><div><b>Lik struktur/størrelse</b> '+same+'</div><div><b>Forskjellig</b> '+diff+'</div><div><b>Kun venstre</b> '+leftOnly+'</div><div><b>Kun høyre</b> '+rightOnly+'</div></div><p class="legend">Grønn = samsvar. Gul = mangler eller avviker. Bruk Hash/Duplikater når innhold må bekreftes byte-for-byte.</p>',true)}async function findDupes(){const files=[...state.left.items.filter(x=>x.kind==='file').map(x=>({side:'Venstre',...x})),...state.right.items.filter(x=>x.kind==='file').map(x=>({side:'Høyre',...x}))];if(!files.length)return setStatus('Ingen filer å analysere.');setStatus('Analyserer duplikater…');const bySize=new Map;files.forEach(f=>{const a=bySize.get(f.size)||[];a.push(f);bySize.set(f.size,a)});const groups=[];for(const a of bySize.values())if(a.length>1){const hashes=new Map;for(const f of a){const h=await digestFile(f.handle),g=hashes.get(h)||[];g.push(f);hashes.set(h,g)}for(const [h,g]of hashes)if(g.length>1)groups.push({h,g})}openDialog('<h3>Duplikater · SHA-256</h3><div class="report">'+(groups.length?groups.map(x=>'<div><b>'+x.g.length+' identiske filer</b><br>'+x.g.map(f=>esc(f.side+' · '+f.name+' · '+fmt(f.size))).join('<br>')+'<br><small>'+x.h+'</small></div>').join(''):'<div>Ingen bekreftede duplikater i de to åpne mappene.</div>')+'</div>');setStatus('Duplikatanalyse ferdig · '+groups.length+' grupper')}function syncPlan(){if(!state.left.handle||!state.right.handle)return setStatus('Åpne begge mapper først.');const L=new Map(state.left.items.map(x=>[x.name,x])),R=new Map(state.right.items.map(x=>[x.name,x])),rows=[];for(const [n,a]of L){const b=R.get(n);if(!b)rows.push('→ Kopier til høyre: '+n);else if(a.kind!==b.kind||a.size!==b.size)rows.push('⚠ Avvik: '+n)}for(const [n]of R)if(!L.has(n))rows.push('← Finnes kun til høyre: '+n);openDialog('<h3>Synkroniseringsforslag</h3><div class="report">'+(rows.length?rows.map(x=>'<div>'+esc(x)+'</div>').join(''):'<div>Mappene ser synkroniserte ut på navn/type/størrelse.</div>')+'</div><p class="legend">Dette er foreløpig et sikkert forslag, ikke automatisk massesynkronisering. Kopiering gjøres med F5 etter kontroll.</p>')}document.querySelectorAll('.pane').forEach(p=>p.onclick=()=>activate(p.dataset.side));document.querySelectorAll('.choose').forEach(b=>b.onclick=e=>{e.stopPropagation();pick(b.closest('.pane').dataset.side)});document.querySelectorAll('.up').forEach(b=>b.onclick=e=>{e.stopPropagation();up(b.closest('.pane').dataset.side)});$('#search').oninput=e=>{state[active].filter=e.target.value;render(active)};$('#copy').onclick=()=>transfer(false);$('#move').onclick=()=>transfer(true);$('#mkdir').onclick=()=>{const s=state[active];if(!s.handle)return;promptBox('Ny mappe','',async n=>{try{await s.handle.getDirectoryHandle(n,{create:true});await refresh(active)}catch(e){setStatus(e.message)}})};$('#rename').onclick=()=>{const s=state[active];if(!s.selected)return;promptBox('Gi nytt navn',s.selected.name,async n=>{try{await copyEntry(s.selected.handle,s.handle,s.selected.name,n);await s.handle.removeEntry(s.selected.name,{recursive:true});s.selected=null;await refresh(active)}catch(e){setStatus(e.message)}})};$('#remove').onclick=async()=>{const s=state[active];if(!s.selected)return;if(!confirm('Slette «'+s.selected.name+'»? Dette kan ikke angres her.'))return;try{await s.handle.removeEntry(s.selected.name,{recursive:true});s.selected=null;await refresh(active);setStatus('Slettet.')}catch(e){setStatus(e.message)}};$('#preview').onclick=()=>showPreview(state[active].selected);$('#hash').onclick=async()=>{const it=state[active].selected;if(!it||it.kind!=='file')return setStatus('Velg en fil.');setStatus('Beregner SHA-256…');const h=await digestFile(it.handle);openDialog('<h3>SHA-256</h3><div class="report"><div><b>'+esc(it.name)+'</b><br><small style="word-break:break-all">'+h+'</small></div></div>',true);setStatus('SHA-256 ferdig')};$('#compare').onclick=compare;$('#dupes').onclick=findDupes;$('#sync').onclick=syncPlan;$('#refresh').onclick=()=>Promise.all(['left','right'].map(s=>state[s].handle?refresh(s):null));$('#help').onclick=()=>openDialog('<h3>Hjelp / Kontakt</h3><div class="contact-card"><p><b>IANS File Commander</b> arbeider lokalt med mapper du selv gir nettleseren tilgang til. Ingen filer lastes opp til IANS.</p><div class="report"><div><b>Henrik Bergfjord</b><br>Teknisk ansvarlig · ians.no</div><div><b>Tips</b><br>F5 kopierer · F6 flytter · F7 lager mappe · dobbeltklikk åpner mappe eller preview.</div></div><a class="btn primary" style="text-align:center;text-decoration:none" href="mailto:kontakt@ians.no?subject=IANS%20File%20Commander">Send e-post til teknisk ansvarlig</a></div>',true);$('#closeDialog').onclick=closeDialog;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeDialog()};window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='F5'){e.preventDefault();transfer(false)}if(e.key==='F6'){e.preventDefault();transfer(true)}if(e.key==='F7'){e.preventDefault();$('#mkdir').click()}});</script></body></html>
