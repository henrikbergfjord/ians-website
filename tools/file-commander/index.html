<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IANS File Commander</title><style>:root{--bg:#030b15;--panel:#081725;--panel2:#06111c;--line:#183b58;--blue:#2c95ff;--cyan:#19d7ff;--text:#eff7ff;--muted:#8fa4b7;--green:#4ade9a;--warn:#ffcb68}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#0d3155,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto}.top{height:62px;padding:0 18px;border-bottom:1px solid #102b42;background:#020914;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900}.brand span{color:var(--cyan)}.top a{color:#9dcfff;text-decoration:none;font-size:.8rem}.toolbar{padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #102b42;background:#05111c}.btn{border:1px solid #245070;background:#0a1d2d;color:#d8ecfb;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:.78rem}.btn.primary{background:#1478dd;border-color:#2e96fb;color:white}.btn.danger{border-color:#6c3940;color:#ffb5b5}.hint{margin-left:auto;color:#73899d;font-size:.72rem}.panes{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.pane{min-width:0;display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}.pane.active{border-color:#2c95ff;box-shadow:0 0 0 1px #2c95ff55}.panehead{padding:10px;border-bottom:1px solid #17354e;background:#081929;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.drive{font-size:.72rem;font-weight:900;color:#71c7ff}.path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9eb3c4;font-size:.75rem}.pick{border:1px solid #28618c;background:#0c2740;color:#bfe4ff;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:.72rem}.list{overflow:auto}.row{display:grid;grid-template-columns:30px minmax(150px,1fr) 95px 145px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #ffffff0b;font-size:.77rem;cursor:default;user-select:none}.row:hover{background:#0b2235}.row.selected{background:#123a5d}.row.folder .name{color:#8ed3ff;font-weight:700}.ico{font-size:16px}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.size,.date{color:#7991a5;text-align:right;font-variant-numeric:tabular-nums}.empty{padding:40px;text-align:center;color:#6f879a}.status{height:34px;padding:0 14px;border-top:1px solid #102b42;background:#020914;display:flex;align-items:center;justify-content:space-between;color:#8097aa;font-size:.72rem}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.card{width:min(440px,100%);padding:22px;border:1px solid #245070;border-radius:14px;background:#071522}.card h3{margin-top:0}.card input{width:100%;padding:10px;border:1px solid #244965;border-radius:8px;background:#030c15;color:white}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh}.panes{grid-template-columns:1fr;min-height:900px}.pane{min-height:430px}.row{grid-template-columns:28px minmax(120px,1fr) 80px}.date{display:none}.hint{display:none}}</style></head><body><div class="app"><header class="top"><div class="brand">IANS <span>FILE COMMANDER</span></div><a href="/teknisk.html">← IANS Teknisk</a></header><div class="toolbar"><button class="btn primary" id="copy">F5 Kopier →</button><button class="btn" id="move">F6 Flytt →</button><button class="btn" id="mkdir">F7 Ny mappe</button><button class="btn" id="rename">Gi nytt navn</button><button class="btn danger" id="remove">Slett</button><span class="hint">Velg fil/mappe i aktivt panel. Operasjoner går til motsatt panel.</span></div><main class="panes"><section class="pane active" id="left" data-side="left"><div class="panehead"><span class="drive">VENSTRE</span><span class="path">Ingen mappe valgt</span><button class="pick">Velg mappe</button></div><div class="list"><div class="empty">Velg en lokal mappe for å starte.</div></div></section><section class="pane" id="right" data-side="right"><div class="panehead"><span class="drive">HØYRE</span><span class="path">Ingen mappe valgt</span><button class="pick">Velg mappe</button></div><div class="list"><div class="empty">Velg en annen mappe.</div></div></section></main><footer class="status"><span id="status">Klar · filer behandles lokalt i nettleseren</span><span id="support"></span></footer></div><div class="modal" id="modal"><div class="card"><h3 id="modalTitle">Ny mappe</h3><input id="modalInput"><div class="actions"><button class="btn" id="cancel">Avbryt</button><button class="btn primary" id="ok">OK</button></div></div></div><script>const FS=!!window.showDirectoryPicker;document.getElementById('support').textContent=FS?'File System Access: klar':'Bruk Edge/Chrome på PC/Mac';const state={left:{handle:null,items:[],selected:null},right:{handle:null,items:[],selected:null}};let active='left';const $=s=>document.querySelector(s),fmt=n=>{if(n==null)return'';for(const u of ['B','KB','MB','GB','TB']){if(n<1024)return(n<10&&u!=='B'?n.toFixed(1):Math.round(n))+' '+u;n/=1024}return n.toFixed(1)+' PB'},date=t=>t?new Date(t).toLocaleString('nb-NO',{dateStyle:'short',timeStyle:'short'}):'';function setStatus(t){$('#status').textContent=t}function activate(side){active=side;document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.dataset.side===side))}async function pick(side){if(!FS)return alert('Dette verktøyet krever Edge eller Chrome med File System Access API.');try{state[side].handle=await showDirectoryPicker({mode:'readwrite'});state[side].selected=null;await refresh(side)}catch(e){if(e.name!=='AbortError')setStatus('Kunne ikke åpne mappe: '+e.message)}}async function refresh(side){const s=state[side],rows=[];if(!s.handle)return;for await(const [name,h]of s.handle.entries()){let size=null,modified=null;if(h.kind==='file'){try{const f=await h.getFile();size=f.size;modified=f.lastModified}catch{}}rows.push({name,handle:h,kind:h.kind,size,modified})}rows.sort((a,b)=>a.kind===b.kind?a.name.localeCompare(b.name,'nb'):a.kind==='directory'?-1:1);s.items=rows;const pane=$('#'+side),list=pane.querySelector('.list');pane.querySelector('.path').textContent=s.handle.name;list.innerHTML=rows.length?'':'<div class="empty">Mappen er tom.</div>';rows.forEach(it=>{const r=document.createElement('div');r.className='row '+(it.kind==='directory'?'folder':'');r.innerHTML='<span class="ico">'+(it.kind==='directory'?'📁':'📄')+'</span><span class="name"></span><span class="size">'+fmt(it.size)+'</span><span class="date">'+date(it.modified)+'</span>';r.querySelector('.name').textContent=it.name;r.onclick=()=>{activate(side);s.selected=it;list.querySelectorAll('.row').forEach(x=>x.classList.remove('selected'));r.classList.add('selected');setStatus(it.name+(it.kind==='file'?' · '+fmt(it.size):' · mappe'))};r.ondblclick=async()=>{if(it.kind==='directory'){s.handle=it.handle;s.selected=null;await refresh(side)}};list.appendChild(r)});setStatus(side.toUpperCase()+': '+rows.length+' elementer')}async function copyEntry(src,dst,name,newName=name){if(src.kind==='file'){const f=await src.getFile(),out=await dst.getFileHandle(newName,{create:true}),w=await out.createWritable();await w.write(await f.arrayBuffer());await w.close()}else{const d=await dst.getDirectoryHandle(newName,{create:true});for await(const [n,h]of src.entries())await copyEntry(h,d,n)}}async function transfer(move=false){const from=state[active],to=state[active==='left'?'right':'left'];if(!from.selected||!to.handle)return setStatus('Velg et element og sørg for at begge paneler har mappe.');try{setStatus((move?'Flytter ':'Kopierer ')+from.selected.name+'…');await copyEntry(from.selected.handle,to.handle,from.selected.name);if(move)await from.handle.removeEntry(from.selected.name,{recursive:true});from.selected=null;await Promise.all([refresh(active),refresh(active==='left'?'right':'left')]);setStatus(move?'Flytting ferdig.':'Kopiering ferdig.')}catch(e){setStatus('Operasjonen feilet: '+e.message)}}function promptBox(title,value,cb){$('#modalTitle').textContent=title;$('#modalInput').value=value||'';$('#modal').classList.add('open');$('#modalInput').focus();$('#modalInput').select();$('#ok').onclick=async()=>{const v=$('#modalInput').value.trim();if(v){$('#modal').classList.remove('open');await cb(v)}}}document.querySelectorAll('.pane').forEach(p=>p.onclick=()=>activate(p.dataset.side));document.querySelectorAll('.pick').forEach(b=>b.onclick=e=>{e.stopPropagation();pick(b.closest('.pane').dataset.side)});$('#copy').onclick=()=>transfer(false);$('#move').onclick=()=>transfer(true);$('#mkdir').onclick=()=>{const s=state[active];if(!s.handle)return;promptBox('Ny mappe','',async n=>{try{await s.handle.getDirectoryHandle(n,{create:true});await refresh(active)}catch(e){setStatus(e.message)}})};$('#rename').onclick=()=>{const s=state[active];if(!s.selected)return;promptBox('Gi nytt navn',s.selected.name,async n=>{try{await copyEntry(s.selected.handle,s.handle,s.selected.name,n);await s.handle.removeEntry(s.selected.name,{recursive:true});s.selected=null;await refresh(active)}catch(e){setStatus(e.message)}})};$('#remove').onclick=async()=>{const s=state[active];if(!s.selected)return;if(!confirm('Slette «'+s.selected.name+'»? Dette bruker nettleserens filtilgang og kan ikke angres her.'))return;try{await s.handle.removeEntry(s.selected.name,{recursive:true});s.selected=null;await refresh(active);setStatus('Slettet.')}catch(e){setStatus(e.message)}};$('#cancel').onclick=()=>$('#modal').classList.remove('open');window.addEventListener('keydown',e=>{if(e.key==='F5'){e.preventDefault();transfer(false)}if(e.key==='F6'){e.preventDefault();transfer(true)}if(e.key==='F7'){e.preventDefault();$('#mkdir').click()}});</script></body></html>
